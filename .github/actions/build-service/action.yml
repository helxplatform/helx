# Single image build implementation for feature validation, develop staging,
# and main release staging. Semantic image tags are never created here;
# build-release.yml promotes a successfully built staging digest separately.
name: Build-Service
description: Build a HeLx service image, optionally pushing a commit-addressed staging tag

inputs:
  app-name:
    description: Name of the service directory under services/
    required: true
  image-name:
    description: Registry repository name. Defaults to app-name and may contain slashes.
    required: false
    default: ''
  context:
    description: Build context. Defaults to ./services/<app-name>
    required: false
    default: ''
  dockerfile:
    description: Dockerfile path. Defaults to <context>/Dockerfile
    required: false
    default: ''
  tag:
    description: Image tag used for this build
    required: true
  push:
    description: Push the image and use the protected registry cache
    required: false
    default: 'false'
  build-args:
    description: Newline-delimited build arguments
    required: false
    default: ''
  containerhub-username:
    description: Harbor username; required only when push is true
    required: false
    default: ''
  containerhub-password:
    description: Harbor password; required only when push is true
    required: false
    default: ''

outputs:
  tags:
    description: Newline-delimited fully qualified image tags used by the build
    value: ${{ steps.params.outputs.tags }}
  digest:
    description: Pushed image digest (empty for non-pushing validation builds)
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Resolve build parameters
      id: params
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE_NAME: ${{ inputs.image-name }}
        IN_CONTEXT: ${{ inputs.context }}
        IN_DOCKERFILE: ${{ inputs.dockerfile }}
        TAG: ${{ inputs.tag }}
        PUSH: ${{ inputs.push }}
        HARBOR_REGISTRY: containers.renci.org/helxplatform
        HARBOR_USERNAME: ${{ inputs.containerhub-username }}
        HARBOR_PASSWORD: ${{ inputs.containerhub-password }}
      run: |
        set -euo pipefail

        valid_tag='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'
        valid_name='^[a-z0-9][a-z0-9._/-]*$'

        if [[ ! "$APP_NAME" =~ $valid_name ]]; then
          echo "::error::Invalid app-name: '$APP_NAME'"
          exit 1
        fi
        if [[ ! "$TAG" =~ $valid_tag ]]; then
          echo "::error::Invalid tag: '$TAG'"
          exit 1
        fi
        if [[ "$PUSH" != true && "$PUSH" != false ]]; then
          echo "::error::push must be 'true' or 'false'"
          exit 1
        fi
        if [[ "$PUSH" == true && ( -z "$HARBOR_USERNAME" || -z "$HARBOR_PASSWORD" ) ]]; then
          echo "::error::Harbor credentials are required when push is true"
          exit 1
        fi

        image="${IMAGE_NAME:-$APP_NAME}"
        if [[ ! "$image" =~ $valid_name ]]; then
          echo "::error::Invalid image-name: '$image'"
          exit 1
        fi

        context="${IN_CONTEXT:-./services/$APP_NAME}"
        dockerfile="${IN_DOCKERFILE:-$context/Dockerfile}"
        if [[ "$context" == *..* || "$dockerfile" == *..* ]]; then
          echo "::error::context/dockerfile may not traverse upward"
          exit 1
        fi
        if [[ ! -f "$dockerfile" ]]; then
          echo "::error::No Dockerfile at $dockerfile"
          exit 1
        fi

        repository="$HARBOR_REGISTRY/$image"
        cache_scope="${image//\//-}"
        if [[ "$PUSH" == true ]]; then
          cache_from="type=registry,ref=$repository:buildcache"
          cache_to="type=registry,ref=$repository:buildcache,mode=max"
        else
          cache_from="type=gha,scope=$cache_scope"
          cache_to="type=gha,scope=$cache_scope,mode=max"
        fi

        {
          echo "tags=$repository:$TAG"
          echo "context=$context"
          echo "dockerfile=$dockerfile"
          echo "cache-from=$cache_from"
          echo "cache-to=$cache_to"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Image build: \`$image:$TAG\`"
          echo ""
          echo "| field | value |"
          echo "| --- | --- |"
          echo "| context | \`$context\` |"
          echo "| dockerfile | \`$dockerfile\` |"
          echo "| image | \`$repository:$TAG\` |"
          echo "| push | \`$PUSH\` |"
          echo "| cache | \`${cache_from%%,*}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

    - name: Login to Harbor
      if: inputs.push == 'true'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: containers.renci.org
        username: ${{ inputs.containerhub-username }}
        password: ${{ inputs.containerhub-password }}
        logout: true

    - name: Build service image
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
      with:
        context: ${{ steps.params.outputs.context }}
        file: ${{ steps.params.outputs.dockerfile }}
        push: ${{ inputs.push }}
        platforms: linux/amd64
        provenance: ${{ inputs.push == 'true' }}
        sbom: ${{ inputs.push == 'true' }}
        build-args: ${{ inputs.build-args }}
        tags: ${{ steps.params.outputs.tags }}
        cache-from: ${{ steps.params.outputs.cache-from }}
        cache-to: ${{ steps.params.outputs.cache-to }}
