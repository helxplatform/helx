name: Build service image
description: Validate or immutably publish one HeLx service image

inputs:
  repository:
    description: Fully qualified image repository without a tag
    required: true
  context:
    description: Docker build context
    required: true
  dockerfile:
    description: Dockerfile path
    required: true
  tag:
    description: Image tag
    required: true
  push:
    description: Push the image when its immutable reference does not already exist
    required: false
    default: 'false'
  registry-username:
    description: Harbor username used only for publishing
    required: false
    default: ''
  registry-password:
    description: Harbor password used only for publishing
    required: false
    default: ''

outputs:
  digest:
    description: Built or existing image digest
    value: ${{ steps.publish.outputs.digest || steps.preflight.outputs.digest || steps.validate.outputs.digest }}
  reference:
    description: Fully qualified image reference
    value: ${{ inputs.repository }}:${{ inputs.tag }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Log in to Harbor
      if: inputs.push == 'true'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: containers.renci.org
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
        logout: true

    - name: Check immutable image reference
      id: preflight
      if: inputs.push == 'true'
      shell: bash
      env:
        REFERENCE: ${{ inputs.repository }}:${{ inputs.tag }}
      run: |
        set -euo pipefail
        error_file="$RUNNER_TEMP/image-preflight.err"
        if output=$(docker buildx imagetools inspect "$REFERENCE" 2>"$error_file"); then
          digest=$(sed -n 's/^Digest:[[:space:]]*//p' <<<"$output" | head -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No unambiguous digest returned for $REFERENCE"; exit 1; }
          printf 'exists=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
        elif grep -Eqi 'manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|404 Not Found|: not found$' "$error_file"; then
          echo 'exists=false' >> "$GITHUB_OUTPUT"
        else
          echo "::error::Could not determine whether $REFERENCE exists"
          cat "$error_file"
          exit 1
        fi

    - name: Validate image build
      id: validate
      if: inputs.push != 'true'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: false
        provenance: false
        sbom: false
        tags: ${{ inputs.repository }}:${{ inputs.tag }}
        cache-from: type=gha,scope=${{ inputs.repository }}
        cache-to: type=gha,scope=${{ inputs.repository }},mode=max

    - name: Build and publish image
      id: publish
      if: inputs.push == 'true' && steps.preflight.outputs.exists == 'false'
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: true
        provenance: true
        sbom: true
        tags: ${{ inputs.repository }}:${{ inputs.tag }}
        cache-from: type=registry,ref=${{ inputs.repository }}:buildcache
        cache-to: type=registry,ref=${{ inputs.repository }}:buildcache,mode=max
