name: Build and publish Helm chart
description: Build, lint, package, and optionally publish one HeLx Helm chart

inputs:
  chart-dir:
    description: Directory containing Chart.yaml
    required: true
  publish:
    description: Publish or reuse the immutable chart version
    required: false
    default: 'false'
  registry:
    description: OCI chart registry
    required: false
    default: oci://ghcr.io/helxplatform/helm-charts
  registry-username:
    description: GHCR username used only for publication
    required: false
    default: ''
  registry-token:
    description: GHCR token used only for publication
    required: false
    default: ''

outputs:
  package:
    description: Packaged chart archive
    value: ${{ steps.chart.outputs.package }}
  published:
    description: Whether this run pushed a new chart version
    value: ${{ steps.preflight.outputs.publish-needed }}

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Install chart tooling requirements
      shell: bash
      run: python -m pip install --requirement .github/requirements-ci.txt

    - name: Set up Helm 3.18.6
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.18.6

    - name: Log in to GHCR
      if: inputs.publish == 'true'
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
      run: printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

    - name: Build, lint, and package chart
      id: chart
      shell: bash
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
      run: bash .github/scripts/helm-build-chart.sh "$CHART_DIR"

    - name: Check immutable chart version
      id: preflight
      if: inputs.publish == 'true'
      shell: bash
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
        PACKAGE: ${{ steps.chart.outputs.package }}
        REGISTRY: ${{ inputs.registry }}
      run: bash .github/scripts/helm-preflight.sh "$REGISTRY" "$CHART_DIR" "$PACKAGE"

    - name: Publish chart
      if: inputs.publish == 'true' && steps.preflight.outputs.publish-needed == 'true'
      shell: bash
      env:
        PACKAGE: ${{ steps.chart.outputs.package }}
        REGISTRY: ${{ inputs.registry }}
      run: helm push "$PACKAGE" "${REGISTRY%/}"
