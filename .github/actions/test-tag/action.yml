# Computes an immutable image tag for a branch build.
#
# Feature branches use test_<branch>_<short-sha>. Develop uses
# develop_<short-sha>; main can request the special `sha` prefix for
# a traceability tag while publishing their semantic release tag separately.
name: Branch-Tag
description: Compute a branch image tag that includes the commit SHA

inputs:
  branch:
    description: Branch name to encode. Defaults to the branch that triggered the run.
    required: false
    default: ''
  prefix:
    description: Tag prefix. test includes the branch name; sha emits only the short SHA; other prefixes use <prefix>_<short-sha>.
    required: false
    default: test

outputs:
  tag:
    description: The computed image tag
    value: ${{ steps.compute.outputs.tag }}
  branch:
    description: The sanitized branch name
    value: ${{ steps.compute.outputs.branch }}
  short-sha:
    description: The 7-character short SHA of HEAD
    value: ${{ steps.compute.outputs.short-sha }}

runs:
  using: composite
  steps:
    - name: Compute branch tag
      id: compute
      shell: bash
      env:
        RAW_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
        RAW_PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail

        branch="$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
        branch="${branch:0:100}"
        branch="${branch%_}"
        prefix="$(printf '%s' "$RAW_PREFIX" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
        prefix="${prefix:0:30}"
        prefix="${prefix%_}"

        if [[ -z "$branch" || -z "$prefix" ]]; then
          echo "::error::Could not derive a valid branch tag from branch '$RAW_BRANCH' and prefix '$RAW_PREFIX'"
          exit 1
        fi

        short_sha="$(git rev-parse --short=7 HEAD)"
        if [[ "$prefix" == test ]]; then
          tag="test_${branch}_${short_sha}"
        elif [[ "$prefix" == sha ]]; then
          tag="$short_sha"
        else
          tag="${prefix}_${short_sha}"
        fi

        {
          echo "tag=$tag"
          echo "branch=$branch"
          echo "short-sha=$short_sha"
        } >> "$GITHUB_OUTPUT"

        echo "Branch image tag: $tag"
