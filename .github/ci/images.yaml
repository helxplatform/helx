# Image defaults
#
# For a service named <name>, the normalized image definition is calculated as:
#
# service root: services/<name>
# name:         <name>
# component:    <name>
# chart:        services/<name>/chart
# repository:   <name>
# context:      services/<name>
# dockerfile:   services/<name>/Dockerfile
# sources:      [services/<name>]
# excludes:     [services/<name>/chart]
#
# Paths in a service override are relative to that service's root. A service
# with an `images` map creates one image per variant; variant defaults use
# <service>/<variant> for the repository and <service>-<variant> for the name.
registry: containers.renci.org/helxplatform
services:
  appstore: {}
  appstore-prepuller:
    context: controller
    dockerfile: controller/Dockerfile
    # This chart reads controller.image.tag, not image.tag.
    tag_path: controller.image.tag
  appstore-sockets:
    images:
      server: {}
      monitoring:
        context: monitoring
        dockerfile: monitoring/Dockerfile
        # This variant is nested under the sockets chart's monitoring key.
        tag_path: monitoring.image.tag
        # Its build context is monitoring/, so parent files cannot reach it.
        sources: [monitoring]
  ldap-sync: {}
  ui:
    repository: helx-ui
  user-mutator: {}
