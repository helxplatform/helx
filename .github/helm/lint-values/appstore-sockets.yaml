# CI-only lint values for the appstore-sockets chart, used when it is linted on
# its own and, nested under appstore-sockets:, when the umbrella is. Helm lint
# does not contact a cluster, so these values exercise the caller-managed publisher
# Secret mode without putting a synthetic secret in rendered manifests.
secret:
  mode: existingSecret
  existingSecret: appstore-sockets-lint-publisher
