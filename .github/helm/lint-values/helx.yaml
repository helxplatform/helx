# CI-only references to caller-managed Secrets. Helm lint does not contact a
# cluster, but these values exercise the current existing-secret interfaces
# without putting synthetic credentials in rendered manifests.
appstore:
  enabled: true
  secret:
    existingSecret: helx-ci-appstore

appstore-sockets:
  enabled: true
  secret:
    existingSecret: helx-ci-appstore-sockets

helx-ldap:
  enabled: true
  secret:
    # Existing-secret mode is the helx-ldap default and must match the Secret
    # name passed through to the upstream OpenLDAP chart.
    existingSecret: openldap-credentials
  openldap:
    global:
      existingSecret: openldap-credentials
