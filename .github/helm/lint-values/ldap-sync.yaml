# CI-only lint values for the ldap-sync chart, used when it is linted on its own
# and, nested under ldap-sync:, when the umbrella is. Helm lint does not
# contact a cluster, so these values exercise the caller-managed LDAP
# credentials Secret mode without putting synthetic passwords in manifests.
secret:
  mode: existingSecret
  existingSecret: ldap-sync-lint-credentials
