# CI-only lint values for the user-mutator chart, used when it is linted on its
# own and, nested under user-mutator:, when the umbrella is. The LDAP password
# Secret only renders where config.features.ldap is turned on, as the Azure
# environments do; naming an existing Secret keeps those renders free of
# synthetic credentials.
ldap:
  secret:
    mode: existingSecret
    existingSecret: user-mutator-lint-ldap-password
