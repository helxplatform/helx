# Credential-free appstore-prepuller validation. Its chart remains excluded.
name: Build-Appstore-Prepuller

on:
  pull_request:
    paths:
      - 'services/appstore-prepuller/**'
      - '!services/appstore-prepuller/chart/**'
      - '.github/actions/build-service/**'
      - '.github/actions/test-tag/**'
      - '.github/workflows/build-appstore-prepuller.yml'
  push:
    branches-ignore:
      - main
      - develop
    paths:
      - 'services/appstore-prepuller/**'
      - '!services/appstore-prepuller/chart/**'
      - '.github/actions/build-service/**'
      - '.github/actions/test-tag/**'
      - '.github/workflows/build-appstore-prepuller.yml'
    tags-ignore:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-appstore-prepuller:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compute validation tag
        id: tag
        uses: ./.github/actions/test-tag

      - name: Build appstore-prepuller without publishing
        uses: ./.github/actions/build-service
        with:
          app-name: appstore-prepuller
          image-name: appstore-prepuller
          context: ./services/appstore-prepuller/controller
          dockerfile: ./services/appstore-prepuller/controller/Dockerfile
          tag: ${{ steps.tag.outputs.tag }}
          push: 'false'
