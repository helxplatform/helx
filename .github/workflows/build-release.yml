# Protected image publication and marked monorepo releases run only after the
# Helm workflow succeeds for the same protected-branch commit. This makes the
# compatibility tag the final record of a coordinated chart/image release.
name: Build-Protected-Services

on:
  workflow_run:
    workflows:
      - Publish-Helm-Charts
    types:
      - completed
    branches:
      - develop
      - main

# FIFO queuing prevents a protected push from being replaced while an earlier
# publication is running.
concurrency:
  group: helx-protected-image-publication
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
      release-tag: ${{ steps.plan.outputs.release-tag }}
      previous-tag: ${{ steps.plan.outputs.previous-tag }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      already-released: ${{ steps.plan.outputs.already-released }}
      plan-hash: ${{ steps.plan.outputs.plan-hash }}
      marker: ${{ steps.plan.outputs.marker }}
    steps:
      - name: Check out the validated commit and complete release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Plan protected image publication
        id: plan
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == develop ]]; then
            python3 .github/scripts/release-plan.py \
              --mode develop \
              --head "$HEAD_SHA" \
              --output release-plan.json \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/release-plan.py \
              --mode release \
              --head "$HEAD_SHA" \
              --output release-plan.json \
              --github-output "$GITHUB_OUTPUT"
          fi

  build-staging-images:
    needs: plan
    if: needs.plan.outputs.has-images == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: >-
      ${{ github.event.workflow_run.head_branch == 'develop' &&
          'harbor-staging' || 'harbor-production' }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build and push ${{ matrix.image.name }} staging image
        id: build
        uses: ./.github/actions/build-service
        with:
          app-name: ${{ matrix.image.app_name }}
          image-name: ${{ matrix.image.image_name }}
          context: ${{ matrix.image.context }}
          dockerfile: ${{ matrix.image.dockerfile }}
          tag: ${{ matrix.image.staging_tag }}
          push: 'true'
          containerhub-username: ${{ secrets.CONTAINERHUB_USERNAME }}
          containerhub-password: ${{ secrets.CONTAINERHUB_PASSWORD }}

      - name: Record the build-produced digest
        if: github.event.workflow_run.head_branch != 'develop'
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          STAGING_REF: ${{ matrix.image.staging_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-digests
          jq -n \
            --arg name "$IMAGE_NAME" \
            --arg staging_ref "$STAGING_REF" \
            --arg digest "$DIGEST" \
            '{name: $name, staging_ref: $staging_ref, digest: $digest}' \
            > "image-digests/$IMAGE_NAME.json"

      - name: Hand the digest to the serialized release job
        if: github.event.workflow_run.head_branch != 'develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digest-${{ matrix.image.name }}
          path: image-digests/${{ matrix.image.name }}.json
          if-no-files-found: error
          retention-days: 1

  release:
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (needs.build-staging-images.result == 'success' ||
       (needs.plan.outputs.has-images == 'false' && needs.build-staging-images.result == 'skipped'))
    needs:
      - plan
      - build-staging-images
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: harbor-production
    steps:
      - name: Check out complete release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Re-plan and verify serialized release state
        env:
          EXPECTED_PLAN_HASH: ${{ needs.plan.outputs.plan-hash }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          python3 .github/scripts/release-plan.py \
            --mode release \
            --head "$COMMIT_SHA" \
            --output release-plan-final.json
          python3 - <<'PY'
          import json
          import os
          import sys

          plan = json.load(open('release-plan-final.json', encoding='utf-8'))
          if plan['plan_hash'] != os.environ['EXPECTED_PLAN_HASH']:
              print('release state changed after staging builds; refusing promotion', file=sys.stderr)
              print(f"expected {os.environ['EXPECTED_PLAN_HASH']}", file=sys.stderr)
              print(f"actual   {plan['plan_hash']}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Download build-produced image digests
        if: >-
          needs.plan.outputs.has-images == 'true' &&
          needs.plan.outputs.already-released != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Set up Docker Buildx for verification and promotion
        if: needs.plan.outputs.already-released != 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to Harbor for verification and promotion
        if: needs.plan.outputs.already-released != 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: containers.renci.org
          username: ${{ secrets.CONTAINERHUB_USERNAME }}
          password: ${{ secrets.CONTAINERHUB_PASSWORD }}
          logout: true

      - name: Promote images and create compatibility files
        env:
          HAS_IMAGES: ${{ needs.plan.outputs.has-images }}
        shell: bash
        run: |
          set -euo pipefail
          digest_args=()
          if [[ "$HAS_IMAGES" == true ]]; then
            digest_args=(--digests image-digests)
          fi
          python3 .github/scripts/release-promote.py \
            --plan release-plan-final.json \
            "${digest_args[@]}" \
            --manifest helx-release-manifest.json \
            --notes helx-release-notes.md \
            --tag-message helx-release-tag-message.txt

      - name: Create and push marked annotated release tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
          RELEASE_MARKER: ${{ needs.plan.outputs.marker }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_sha" != "$COMMIT_SHA" ]]; then
              echo "::error::$RELEASE_TAG already exists at $existing_sha, not $COMMIT_SHA"
              exit 1
            fi
            if ! git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" | \
              grep -Fxq "$RELEASE_MARKER"; then
              echo "::error::$RELEASE_TAG exists but is not a marked monorepo release"
              exit 1
            fi
            echo "$RELEASE_TAG is already the marked tag for this commit"
          else
            git tag --annotate "$RELEASE_TAG" "$COMMIT_SHA" --file helx-release-tag-message.txt
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file helx-release-notes.md
            gh release upload "$RELEASE_TAG" helx-release-manifest.json --clobber
          else
            gh release create "$RELEASE_TAG" helx-release-manifest.json \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file helx-release-notes.md
          fi
