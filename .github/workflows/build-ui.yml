# Credential-free UI image validation. Chart-only changes remain excluded.
name: Build-UI

on:
  pull_request:
    paths:
      - 'services/ui/**'
      - '!services/ui/chart/**'
      - '.github/actions/build-service/**'
      - '.github/actions/test-tag/**'
      - '.github/workflows/build-ui.yml'
  push:
    branches-ignore:
      - main
      - develop
    paths:
      - 'services/ui/**'
      - '!services/ui/chart/**'
      - '.github/actions/build-service/**'
      - '.github/actions/test-tag/**'
      - '.github/workflows/build-ui.yml'
    tags-ignore:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compute validation tag
        id: tag
        uses: ./.github/actions/test-tag

      - name: Build UI without publishing
        uses: ./.github/actions/build-service
        with:
          app-name: ui
          image-name: helx-ui
          tag: ${{ steps.tag.outputs.tag }}
          push: 'false'
