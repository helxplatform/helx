name: Develop channel

# Every push to develop republishes one mutable candidate chart,
# oci://ghcr.io/helxplatform/helm-charts/helx:<version>-develop, built from the
# branch tree and pinned to immutable develop-<sha> images. Releases are
# untouched: candidates are SemVer prereleases and always sort below <version>.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Never cancel: images publish before the chart that pins them, so a cancelled
# run only leaves the channel behind, never pointing at a missing image.
concurrency:
  group: develop-channel
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHART_REGISTRY: oci://ghcr.io/helxplatform/helm-charts
  COMMON_CHART: deploy/helm/helx-common/chart
  UMBRELLA_CHART: deploy/helm/helx-chart
  CHANNEL: develop

jobs:
  self-test:
    name: Self-test develop channel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Run CI unit tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate CI configuration
        run: python .github/scripts/ci.py validate-config
      - name: Require chart and image version increases
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before || format('{0}^', github.sha) }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'No previous develop commit to compare against.'
          else
            python .github/scripts/ci.py check-versions --base "$BASE_SHA" \
              --umbrella-above-release
          fi
      - name: Install actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  validate-common:
    name: Validate common chart
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate common chart
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ env.COMMON_CHART }}
          publish: 'false'
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

  plan-charts:
    name: Plan service charts
    needs: validate-common
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Create service chart matrix
        id: plan
        run: python .github/scripts/ci.py chart-matrix --github-output "$GITHUB_OUTPUT"

  validate-charts:
    name: Validate ${{ matrix.chart }}
    needs: plan-charts
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.plan-charts.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate service chart
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ matrix.chart }}
          publish: 'false'
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

  plan-images:
    name: Plan candidate images
    needs: validate-common
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      # Every image is rebuilt because the candidate chart pins one shared
      # develop-<sha> tag, which must resolve for every dependency image.
      - name: Create candidate image matrix
        id: plan
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python .github/scripts/ci.py image-matrix --all
          --channel "$CHANNEL" --commit "$COMMIT_SHA"
          --github-output "$GITHUB_OUTPUT"

  publish-images:
    name: Publish ${{ matrix.image.name }}:${{ matrix.image.tag }}
    needs:
      - plan-images
      - validate-charts
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.plan-images.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish candidate image
        uses: ./.github/actions/build-service
        with:
          repository: containers.renci.org/helxplatform/${{ matrix.image.repository }}
          context: ${{ matrix.image.context }}
          dockerfile: ${{ matrix.image.dockerfile }}
          tag: ${{ matrix.image.tag }}
          push: 'true'
          registry-username: ${{ secrets.CONTAINERHUB_USERNAME }}
          registry-password: ${{ secrets.CONTAINERHUB_PASSWORD }}

  publish-candidate:
    name: Publish candidate umbrella
    needs: publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      chart-version: ${{ steps.candidate.outputs.chart-version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish candidate umbrella
        id: candidate
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ env.UMBRELLA_CHART }}
          publish: 'true'
          registry: ${{ env.CHART_REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}
          channel: ${{ env.CHANNEL }}
          channel-commit: ${{ github.sha }}
      - name: Summarize the candidate
        shell: bash
        env:
          CHART_VERSION: ${{ steps.candidate.outputs.chart-version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Develop candidate \`$CHART_VERSION\`"
            echo
            echo "Built from \`$COMMIT_SHA\`. Images pinned to \`$CHANNEL-${COMMIT_SHA:0:7}\`."
            echo
            echo '```bash'
            echo "helm registry login ghcr.io"
            echo "helm upgrade --install helx \\"
            echo "  oci://ghcr.io/helxplatform/helm-charts/helx \\"
            echo "  --version $CHART_VERSION -n helx --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  develop-gate:
    name: Develop channel gate
    if: always()
    needs:
      - self-test
      - validate-common
      - plan-charts
      - validate-charts
      - plan-images
      - publish-images
      - publish-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every develop job to pass
        shell: bash
        env:
          SELF_TEST: ${{ needs.self-test.result }}
          COMMON: ${{ needs.validate-common.result }}
          CHART_PLAN: ${{ needs.plan-charts.result }}
          CHARTS: ${{ needs.validate-charts.result }}
          IMAGE_PLAN: ${{ needs.plan-images.result }}
          IMAGES: ${{ needs.publish-images.result }}
          CANDIDATE: ${{ needs.publish-candidate.result }}
        run: |
          set -euo pipefail
          statuses=(
            "Self-test develop channel|$SELF_TEST"
            "Validate common chart|$COMMON"
            "Plan service charts|$CHART_PLAN"
            "Validate service charts|$CHARTS"
            "Plan candidate images|$IMAGE_PLAN"
            "Publish candidate images|$IMAGES"
            "Publish candidate umbrella|$CANDIDATE"
          )
          failed=0
          for status in "${statuses[@]}"; do
            name=${status%%|*}
            result=${status#*|}
            printf '%-30s %s\n' "$name" "$result"
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::$name finished with result: $result"
              failed=1
            fi
          done
          exit "$failed"
