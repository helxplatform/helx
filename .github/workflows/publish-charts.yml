# Chart validation runs for chart PRs and every push. Running on every protected
# push intentionally provides the success gate that coordinates image publication
# and the final marked monorepo release in build-release.yml.
name: Publish-Helm-Charts

on:
  pull_request:
    paths:
      - 'services/*/chart/**'
      - 'deploy/helm/helx-chart/**'
      - '.github/actions/publish-charts/**'
      - '.github/workflows/publish-charts.yml'
      - '.github/helm/**'
      - '.github/scripts/helm*'
      - '.github/release/**'
      - '.github/scripts/release-*'
      - '.github/workflows/build-release.yml'
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'
  workflow_dispatch:
    inputs:
      chart-dir:
        description: "Chart to validate: 'all' or a services/*/chart path"
        required: true
        default: all
        type: string

# Main has one FIFO publication lock. Other refs have independent validation
# locks and newer runs do not discard a queued production publication.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      'publication' || github.ref
    }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  CHART_REGISTRY: oci://ghcr.io/helxplatform/helm-charts

jobs:
  select-charts:
    name: Select charts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      validation-charts: ${{ steps.charts.outputs.validation-charts }}
      validation-matrix: ${{ steps.charts.outputs.validation-matrix }}
      publish-charts: ${{ steps.charts.outputs.publish-charts }}
      publish-service-matrix: ${{ steps.charts.outputs.publish-service-matrix }}
      publish-umbrella: ${{ steps.charts.outputs.publish-umbrella }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Test CI planning and metadata helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/release -p 'test_*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Select validation and publication charts
        id: charts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_CHART: ${{ inputs.chart-dir || 'all' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/helm-select-charts.sh

  validate:
    name: Validate ${{ matrix.chart-dir }}
    needs: select-charts
    strategy:
      fail-fast: false
      matrix:
        chart-dir: ${{ fromJSON(needs.select-charts.outputs.validation-matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        if: matrix.chart-dir != '__none__'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and validate chart
        if: matrix.chart-dir != '__none__'
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ matrix.chart-dir }}
          publish: 'false'
          registry: ${{ env.CHART_REGISTRY }}

  preflight:
    name: Verify all selected immutable chart versions
    needs:
      - select-charts
      - validate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.select-charts.outputs.publish-charts != '[]' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Helm 3.18.6
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.18.6

      - name: Authenticate to GHCR
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and compare every directly changed version
        shell: bash
        env:
          SELECTED_CHARTS: ${{ needs.select-charts.outputs.publish-charts }}
        run: |
          set -euo pipefail
          mapfile -t charts < <(jq -r '.[]' <<< "$SELECTED_CHARTS")
          for chart in "${charts[@]}"; do
            chart_output=$(mktemp)
            GITHUB_OUTPUT="$chart_output" bash .github/scripts/helm-build-chart.sh "$chart"
            package=$(sed -n 's/^package=//p' "$chart_output")
            if [[ -z "$package" ]]; then
              echo "::error::No package output was produced for $chart"
              exit 1
            fi
            GITHUB_OUTPUT= bash .github/scripts/helm-preflight.sh \
              "$CHART_REGISTRY" "$chart" "$package"
          done

  publish-services:
    name: Publish ${{ matrix.chart-dir }}
    needs:
      - select-charts
      - preflight
    if: needs.preflight.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chart-dir: ${{ fromJSON(needs.select-charts.outputs.publish-service-matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        if: matrix.chart-dir != '__none__'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Publish or reuse service chart
        if: matrix.chart-dir != '__none__'
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ matrix.chart-dir }}
          publish: 'true'
          registry: ${{ env.CHART_REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

  publish-umbrella:
    name: Publish umbrella chart
    needs:
      - select-charts
      - preflight
      - publish-services
    if: >-
      always() &&
      needs.select-charts.outputs.publish-umbrella == 'true' &&
      needs.preflight.result == 'success' &&
      (needs.publish-services.result == 'success' || needs.publish-services.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Publish or reuse umbrella chart after service charts
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: deploy/helm/helx-chart
          publish: 'true'
          registry: ${{ env.CHART_REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}
