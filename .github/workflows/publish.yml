name: Publish

on:
  push:
    branches:
      - main
    tags-ignore:
      - '*'
  workflow_dispatch:
    inputs:
      release-current:
        description: Create a release for the current main commit even without a version delta
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHART_REGISTRY: oci://ghcr.io/helxplatform/helm-charts
  COMMON_CHART: deploy/helm/helx-common/chart
  UMBRELLA_CHART: deploy/helm/helx-chart

jobs:
  self-test:
    name: Self-test publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Run tests and validate release inputs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before || format('{0}^', github.sha) }}
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/ci.py validate-config
          if [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            python .github/scripts/ci.py check-versions --base "$BASE_SHA"
          fi

  publish-common:
    name: Publish or reuse common chart
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish or reuse common chart
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ env.COMMON_CHART }}
          publish: 'true'
          registry: ${{ env.CHART_REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

  plan-charts:
    name: Plan service charts
    needs: publish-common
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Create service chart matrix
        id: plan
        run: python .github/scripts/ci.py chart-matrix --github-output "$GITHUB_OUTPUT"

  publish-services:
    name: Publish ${{ matrix.chart }}
    needs:
      - publish-common
      - plan-charts
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chart: ${{ fromJSON(needs.plan-charts.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish or reuse service chart
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ matrix.chart }}
          publish: 'true'
          registry: ${{ env.CHART_REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

  publish-umbrella:
    name: Publish or reuse umbrella chart
    needs:
      - publish-common
      - plan-charts
      - publish-services
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish or reuse umbrella after service charts
        uses: ./.github/actions/publish-charts
        with:
          chart-dir: ${{ env.UMBRELLA_CHART }}
          publish: 'true'
          registry: ${{ env.CHART_REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

  plan-images:
    name: Plan all images
    needs:
      - publish-common
      - publish-umbrella
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Create complete image matrix
        id: plan
        run: python .github/scripts/ci.py image-matrix --all --github-output "$GITHUB_OUTPUT"

  publish-images:
    name: Publish ${{ matrix.image.name }}:${{ matrix.image.tag }}
    needs:
      - publish-common
      - plan-images
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.plan-images.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish or reuse direct semantic image tag
        uses: ./.github/actions/build-service
        with:
          repository: containers.renci.org/helxplatform/${{ matrix.image.repository }}
          context: ${{ matrix.image.context }}
          dockerfile: ${{ matrix.image.dockerfile }}
          tag: ${{ matrix.image.tag }}
          push: 'true'
          registry-username: ${{ secrets.CONTAINERHUB_USERNAME }}
          registry-password: ${{ secrets.CONTAINERHUB_PASSWORD }}

  release-info:
    name: Determine release
    needs:
      - publish-common
      - publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.info.outputs.release }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install CI requirements
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Resolve release metadata
        id: info
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before || format('{0}^', github.sha) }}
          FORCE_RELEASE: ${{ inputs.release-current || false }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="${GITHUB_SHA}^"; fi
          args=(release-info --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$FORCE_RELEASE" == true ]]; then args+=(--force); fi
          python .github/scripts/ci.py "${args[@]}"

  release:
    name: Release ${{ needs.release-info.outputs.tag }}
    if: needs.release-info.outputs.release == 'true'
    needs:
      - publish-common
      - publish-umbrella
      - publish-images
      - release-info
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install release requirements
        run: python -m pip install --requirement .github/requirements-ci.txt

      - name: Set up Helm 3.18.6
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.6

      - name: Log in to GHCR for umbrella dependencies
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build umbrella and materialize chart archives
        run: bash .github/scripts/helm-build-chart.sh "$UMBRELLA_CHART"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Harbor
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: containers.renci.org
          username: ${{ secrets.CONTAINERHUB_USERNAME }}
          password: ${{ secrets.CONTAINERHUB_PASSWORD }}
          logout: true

      - name: Create release manifest and notes
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python .github/scripts/ci.py release-manifest
          --commit "$COMMIT_SHA"
          --output helx-release-manifest.json
          --notes helx-release-notes.md

      - name: Create or reuse annotated release tag
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_commit=$(git rev-list -n 1 "$RELEASE_TAG")
            [[ "$existing_commit" == "$COMMIT_SHA" ]] || { echo "::error::$RELEASE_TAG points to $existing_commit, not $COMMIT_SHA"; exit 1; }
            [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]] || { echo "::error::$RELEASE_TAG is not annotated"; exit 1; }
          else
            git tag --annotate "$RELEASE_TAG" "$COMMIT_SHA" --message "HeLx release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file helx-release-notes.md
            gh release upload "$RELEASE_TAG" helx-release-manifest.json --clobber
          else
            gh release create "$RELEASE_TAG" helx-release-manifest.json --verify-tag --title "$RELEASE_TAG" --notes-file helx-release-notes.md
          fi
