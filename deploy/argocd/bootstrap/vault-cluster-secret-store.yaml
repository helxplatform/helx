# The one place External Secrets reads Vault from, for every HeLx namespace.
# Every ExternalSecret under deploy/argocd/envs/ names it as
# secretStoreRef {name: vault, kind: ClusterSecretStore}.
#
# It logs in with a Vault token kept in the Secret `vault-token` in the
# external-secrets namespace. That Secret is created by hand on each cluster
# and never committed. vault-token-renewal.yaml keeps the token alive; it
# still has to be replaced once a year. See "Connect External Secrets to
# Vault" in docs/argocd-setup-in-new-cluster.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  # Only these namespaces may use this store. Add a namespace here when you
  # add an environment under deploy/argocd/envs/.
  conditions:
    - namespaces:
        - ai-sb-test
  provider:
    vault:
      server: https://vault.apps.renci.org
      # KV version 2 mount. Entries are <tier>/<cloud>/<namespace>/<service>/
      # <Kubernetes Secret name>, e.g. dev/azure/ai-sb-test/appstore/helx-postgresql.
      path: helx
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
