# The two PostgreSQL subcharts cannot render an ExternalSecret themselves, so
# these fill the Secrets that values.yaml points their auth.existingSecret at.
# The names are the ones the subcharts created under Helm, so nothing that
# reads them changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helx-postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: helx-postgresql
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: helx/ai-sb-test/helx-postgresql
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helx-ldap-sync-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: helx-ldap-sync-postgres
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: helx/ai-sb-test/helx-ldap-sync-postgres
