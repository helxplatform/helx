# How External Secrets reads Vault for this namespace. Every ExternalSecret the
# HeLx charts render names a SecretStore called `vault` by default.
#
# ESO logs in with a short-lived token for the external-secrets-vault
# ServiceAccount, using Vault's JWT auth. Vault checks the token against this
# cluster's public OIDC issuer, so Vault never has to connect to the cluster:
# only the cluster has to reach Vault. See "Connect External Secrets to Vault"
# in docs/argocd-setup-in-new-cluster.md.
#
# TODO(vault): replace server, path, and auth.jwt.path with the values from
# the Vault administrators.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.example.org
      # KV version 2 mount that holds helx/ai-sb-test/*.
      path: secret
      version: v2
      auth:
        jwt:
          # Vault JWT auth mount configured with this cluster's issuer.
          path: jwt-ai-sandbox
          role: helx-ai-sb-test
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets-vault
            # Must match bound_audiences on the Vault role.
            audiences:
              - vault
