# Argo CD-only values for ai-sb-test, layered after
# deploy/helm/values/azure/defaults/values.yaml and
# deploy/helm/values/azure/envs/ai-sb-test/values.yaml.
#
# Argo CD renders the chart with `helm template`, so Helm's `lookup` finds
# nothing and every render is a fresh install. Anything a chart would otherwise
# generate or carry over from the live cluster (passwords, the webhook
# certificate) must come from somewhere fixed, or Argo CD would replace it on
# every sync. Here that is Vault, through the SecretStore named `vault` in
# manifests/secret-store.yaml.
#
# Each Vault entry is named after the Kubernetes Secret it fills, under
# helx/ai-sb-test/, and holds exactly that Secret's keys.

appstore:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      remoteRef: helx/ai-sb-test/helx-appstore-secrets
    # Migration reads live Secrets, which Argo CD cannot do.
    migration:
      enabled: false
  pgadmin:
    secret:
      mode: externalSecret
      externalSecret:
        enabled: true
        remoteRef: helx/ai-sb-test/pgadmin-env
  # The bitnami subchart would generate a new admin password on every render.
  # manifests/postgres-secrets.yaml fills this Secret from Vault instead.
  postgresql:
    global:
      postgresql:
        auth:
          existingSecret: helx-postgresql

appstore-sockets:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      remoteRef: helx/ai-sb-test/helx-appstore-sockets

helx-ldap:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      remoteRef: helx/ai-sb-test/openldap-credentials

ldap-sync:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      remoteRef: helx/ai-sb-test/helx-ldap-sync-secrets
  # Same as appstore's PostgreSQL: filled by manifests/postgres-secrets.yaml.
  postgres:
    auth:
      existingSecret: helx-ldap-sync-postgres

user-mutator:
  # The default, secret.mode: generate, makes a new CA on every render, which
  # would also change the webhook's caBundle on every sync.
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      remoteRef: helx/ai-sb-test/helx-user-mutator-tls
  webhook:
    # The CA that signed the serving certificate in Vault; it is public, not a
    # secret. Copied from the live webhook before the takeover:
    #   kubectl get mutatingwebhookconfiguration \
    #     helx-user-mutator-webhook-ai-sb-test \
    #     -o jsonpath='{.webhooks[0].clientConfig.caBundle}'
    # Valid until 2036-10-11. Replace it together with the Vault entry.
    caBundle: 
  ldap:
    secret:
      mode: externalSecret
      externalSecret:
        enabled: true
        remoteRef: helx/ai-sb-test/helx-user-mutator-ldap-password
