# Argo CD-only values for ai-sb-test, layered after
# deploy/helm/values/azure/defaults/values.yaml and
# deploy/helm/values/azure/envs/ai-sb-test/values.yaml.
#
# Argo CD renders the chart with `helm template`, so Helm's `lookup` finds
# nothing and every render is a fresh install. Anything a chart would otherwise
# generate or carry over from the live cluster (passwords, the webhook
# certificate) must come from somewhere fixed, or Argo CD would replace it on
# every sync. Here that is Vault, through the ClusterSecretStore named `vault`
# in deploy/argocd/bootstrap/vault-cluster-secret-store.yaml. The charts
# default to a namespaced SecretStore, so each externalSecret below names the
# kind as well.
#
# Each Vault entry, on the `helx` KV mount, is named after the Kubernetes
# Secret it fills and sits under the service that owns it, for example
# dev/azure/ai-sb-test/appstore/helx-postgresql. It holds exactly that
# Secret's keys. The dev/azure/ai-sb-test/<service> entries next to them,
# holding secrets.yaml, are Helm values files for `make helm-deploy`; External
# Secrets can't use those, because it copies an entry's keys as they are.

appstore:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      remoteRef: dev/azure/ai-sb-test/appstore/helx-appstore-secrets
    # Migration reads live Secrets, which Argo CD cannot do.
    migration:
      enabled: false
  pgadmin:
    secret:
      mode: externalSecret
      externalSecret:
        enabled: true
        secretStoreRef:
          name: vault
          kind: ClusterSecretStore
        remoteRef: dev/azure/ai-sb-test/appstore/pgadmin-env
  # The bitnami subchart would generate a new admin password on every render.
  # manifests/postgres-secrets.yaml fills this Secret from Vault instead.
  postgresql:
    global:
      postgresql:
        auth:
          existingSecret: helx-postgresql

appstore-sockets:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      remoteRef: dev/azure/ai-sb-test/appstore-sockets/helx-appstore-sockets

helx-ldap:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      remoteRef: dev/azure/ai-sb-test/helx-ldap/openldap-credentials

ldap-sync:
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      remoteRef: dev/azure/ai-sb-test/ldap-sync/helx-ldap-sync-secrets
  # Same as appstore's PostgreSQL: filled by manifests/postgres-secrets.yaml.
  postgres:
    auth:
      existingSecret: helx-ldap-sync-postgres

user-mutator:
  # The default, secret.mode: generate, makes a new CA on every render, which
  # would also change the webhook's caBundle on every sync.
  secret:
    mode: externalSecret
    externalSecret:
      enabled: true
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      remoteRef: dev/azure/ai-sb-test/user-mutator/helx-user-mutator-tls
  webhook:
    # The CA that signed the serving certificate in Vault; it is public, not a
    # secret. Copied from the live webhook before the takeover:
    #   kubectl get mutatingwebhookconfiguration \
    #     helx-user-mutator-webhook-ai-sb-test \
    #     -o jsonpath='{.webhooks[0].clientConfig.caBundle}'
    # Valid until 2036-10-11. Replace it together with the Vault entry.
    caBundle: 
  ldap:
    secret:
      mode: externalSecret
      externalSecret:
        enabled: true
        secretStoreRef:
          name: vault
          kind: ClusterSecretStore
        remoteRef: dev/azure/ai-sb-test/user-mutator/helx-user-mutator-ldap-password
