# Parent chart for HeLx.

ambassador:
  # -- enable/disable deployment of Ambassador
  enabled: false
appstore:
  # -- enable/disable deployment of appstore
  enabled: true
  tycho:
    # -- routing data plane for Tycho-launched apps: "proxy" (ClusterIP +
    # /private, resolved by appstore via resty) or "ambassador" (legacy).
    appRoutingMode: proxy
appstore-prepuller:
  # -- enable/disable deployment of appstore-prepuller
  enabled: true
appstore-sockets:
  # -- enable/disable deployment of appstore websockets service
  enabled: true
helx-ldap:
  # -- enable/disable deployment of the HeLx LDAP service
  enabled: true
ldap-sync:
  # -- enable/disable deployment of ldap-sync
  enabled: true
pod-reaper:
  # -- enable/disable deployment of pod-reaper
  enabled: true
resty:
  # -- enable/disable deployment of resty
  enabled: true
ui:
  # -- enable/disable deployment of helx-ui
  enabled: true
user-mutator:
  # -- enable/disable deployment of user-mutator
  enabled: true

  # user-mutator is turnkey by its own defaults as of chart 2.0.0: it generates
  # the webhook serving certificate and renders the
  # MutatingWebhookConfiguration with the matching CA bundle, selecting
  # namespaces by their automatic kubernetes.io/metadata.name label. Nothing
  # has to be labelled by hand and no out-of-band tooling has to run.
  #
  # To keep a certificate and webhook configuration managed outside the chart,
  # set user-mutator.secret.generate.enabled and user-mutator.webhook.enabled
  # to false and point user-mutator.secret.existingSecret at the Secret name.

global:
  # tycho_api_service_name: helx-tycho-api
  restartr_api_service_name: helx-restartr-api-service
  stdnfsPvc: stdnfs
  ambassador_service_name: ambassador
  redis:
    existingSecret: redis-secret
    existingSecretPasswordKey: redis-password
