# Parent chart for HeLx.

# ambassador:
#   # -- enable/disable deployment of Ambassador
#   enabled: true
appstore:
  # -- enable/disable deployment of appstore
  enabled: true
appstore-prepuller:
  # -- enable/disable deployment of appstore-prepuller
  enabled: true
appstore-sockets:
  # -- enable/disable deployment of appstore websockets service
  enabled: true
helx-ldap:
  # -- enable/disable deployment of the HeLx LDAP service
  enabled: true
ldap-sync:
  # -- enable/disable deployment of ldap-sync
  enabled: true
pod-reaper:
  # -- enable/disable deployment of pod-reaper
  enabled: true
resty:
  # -- enable/disable deployment of resty
  enabled: true
# tycho-api:
#   # -- enable/disable deployment of tycho-api
#   enabled: false
ui:
  # -- enable/disable deployment of helx-ui
  enabled: true
user-mutator:
  # -- enable/disable deployment of user-mutator
  enabled: false

global:
  # tycho_api_service_name: helx-tycho-api
  restartr_api_service_name: helx-restartr-api-service
  stdnfsPvc: stdnfs
  ambassador_service_name: ambassador
  redis:
    existingSecret: redis-secret
    existingSecretPasswordKey: redis-password
