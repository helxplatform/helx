# mism-sandbox on mism-test (unc-renci-services / mism-k8s) — helx develop 5.1.1-develop
# Images, pull secrets and the unc-group-x hook come from the chart defaults (Harbor);
# only env-specific values are set here.

appstore:
  # djangoSettings: helx          # inherited from azure defaults (D7 option B)
  django:
    ALLOW_SAML_LOGIN: "false"                    # D3: Keycloak OIDC (realm mism), not SAML
    ALLOW_DJANGO_LOGIN: "false"                  # no password form on the login page; break-glass admin login stays at /admin/login/
    # Keycloak login (realm mism, which forwards to CILogon).
    OIDC_DISPLAY_NAME: "MDSC Login"              # button label; the provider id stays keycloak. Never "CILogon"
    USERNAME_FROM_LDAP: "true"                   # username = uid of the LDAP entry whose mail is the login email
    SOCIALACCOUNT_EMAIL_AUTHENTICATION: "true"   # a login attaches to the Django user with the same verified email
  ldap:
    # ldap.enabled, uri and searchBase come from the defaults (ldap://openldap, ou=users).
    groupDN: cn=helx-users,ou=groups,dc=example,dc=org   # the allow-list: only its members get in
    # helx-ldap's add-only appstore account (helx-ldap.configuration.appstoreAccount),
    # not the directory admin: it can only add accounts in ou=external.
    bindDN: cn=appstore,dc=example,dc=org
    bindPasswordSecret:
      name: openldap-credentials                         # helx-ldap's Secret (key LDAP_APPSTORE_PASSWORD)
    provision:
      emailDomains: [duke.edu, uchc.edu]                 # LDAP account created at first login
  tycho:
    externalAppRegistryBranch: helx-mism-sandbox-azure   # D4
  userStorage:
    storageClass: azurefile-csi-nfs-pe           # NFS + private endpoint (R3, ACISITSM-3499)
  postgresql:
    persistence:
      # Workaround so `helm --wait` can finish. The appstore chart always creates
      # appstore-postgresql-pvc, meant as postgres' data volume, but the bundled
      # bitnami postgresql chart ignores it and keeps its data on its own volume,
      # data-<release>-postgresql-0. Nothing ever mounts appstore-postgresql-pvc,
      # so on the default Azure Disk class, which only provisions once a pod uses
      # the claim, it stays Pending and every install or upgrade times out.
      # Azure Files provisions right away, so the claim binds. It stays empty.
      # On an existing release, delete the unbound claim before upgrading: a
      # claim's storage class can't change after creation.
      storageClass: azurefile-csi
  security:
    # mism-test enforces NetworkPolicy, and launched apps may only egress to
    # DNS and non-private addresses. Their nslcd sidecar needs openldap.
    appEgressAllowedPods:
    - app.kubernetes.io/name: openldap

appstore-prepuller:
  appRegistry:
    branch: helx-mism-sandbox-azure              # D4
    brand: helx                                  # must equal the appstore brand (D7 option B)

ldap-sync:
  searchBootstrap:
    # Set explicitly (D5): MISM syncs the AI Sandbox groups. The azure defaults
    # filter is unc:app:renci:internal:*. id (get-groups) and baseDN
    # (ou=groups,dc=unc,dc=edu) are inherited from the azure defaults.
    filter: '(&(objectClass=uncgroup)(cn=unc:app:renci:ai-sandbox:*))'
  # config.source (ldaps://ldap.unc.edu/, bind cn=unc:app:renci:helx:ns) is
  # inherited unchanged from the azure defaults.

resty:
  SSL:
    nginxTLSSecret: ai-sb.renci.org-tls          # pre-issued 2026-10-29 (Certificate mism-sandbox/ai-sb.renci.org-tls)
  ingress:
    annotations:                                 # merged into the defaults' annotations
      # Removed from azure defaults on develop (HTTP-01 solver vs AKS HTTPS-only policy).
      # On mism-test that policy is dryrun and letsencrypt (HTTP-01) already issues certs.
      cert-manager.io/cluster-issuer: letsencrypt
  service:
    serverName: ai-sb.renci.org

ui:
  config:
    brand_name: helx                             # D7 option B
    login_title: MDSC Sandbox Workspaces
    meta:
      title: MDSC Sandbox
    brand_description:
      html: |
        <a href="https://helxplatform.github.io/">HeLx</a> empowers researchers to work with their
        preferred tools and apps in the cloud at scale without installation or other infrastructure concerns.
        <br />&nbsp;<br />
        The MDSC Sandbox is a deployment of HeLx for researchers and students to use and explore.
    support:
      help_portal_url: https:\/\/renci.atlassian.net\/servicedesk\/customer\/portal\/9   # confirm MISM support URLs
      user_guide_url: https:\/\/renci.atlassian.net\/wiki\/x\/BID7P

# user-mutator.webhook: mode create (chart default) and the admissions.enforcer/disabled
# annotation (azure defaults) are inherited; keep.
# No containerSecurityContext/securityContext overrides anywhere: chart defaults carry
# allowPrivilegeEscalation: false, which the AKS deny policy requires.
