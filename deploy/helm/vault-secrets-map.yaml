# The Kubernetes Secrets the umbrella's charts create, the service each belongs
# to, and where each of its keys lives in the Helm values. Read by
# .github/scripts/vault_secrets.py, behind four Make targets:
#
#   make helm-secrets-to-vault        values files  -> one JSON file per Secret
#   make vault-secrets-to-helm        JSON files    -> one secrets.yaml
#   make vault-secrets-from-cluster   live Secrets  -> one JSON file per Secret
#   make vault-secrets-upload         JSON files    -> Vault entries
#
# A JSON file holds exactly its Secret's keys, so it can be uploaded to Vault as
# it is (`vault kv put -mount=helx <path>/<service>/<secret> @<file>`), and
# External Secrets copies those keys straight back into the Secret. See section
# 5 of docs/argocd-setup-in-new-cluster.md.
#
# For each Secret:
#   name     The Secret's name. {release} is the Helm release name (RELEASE).
#   service  The folder it goes in, in Vault and in the output directory.
#   values   Every key goes under this values path: key K becomes <values>.K.
#            Used by the charts built on helx-common, whose Secret takes its
#            keys straight from a `values` block.
#   keys     Otherwise, the values path for each key, one by one.
#   derived  Keys the chart works out from other values. They are rendered
#            into the JSON, but never written back to secrets.yaml.
#   set      Fixed values secrets.yaml needs alongside this Secret's keys, for
#            a chart whose default would not take them.
#   encoded  Values written to secrets.yaml as the base64 of one of this
#            Secret's keys, e.g. a CA bundle.
#
# A Secret missing here is not handled by the targets. When a chart gains a
# Secret that Argo CD fills through External Secrets, add it here too.
secrets:
  - name: "{release}-appstore-secrets"
    service: appstore
    values: appstore.secret.values

  - name: pgadmin-env
    service: appstore
    values: appstore.pgadmin.secret.values

  # The bundled bitnami PostgreSQL. `password` is appstore's own database user
  # (the same value as PG_DB_PASSWORD); `postgres-password` is the admin.
  - name: "{release}-postgresql"
    service: appstore
    keys:
      password: appstore.postgresql.global.postgresql.auth.password
      postgres-password: appstore.postgresql.global.postgresql.auth.postgresPassword

  - name: "{release}-appstore-sockets"
    service: appstore-sockets
    values: appstore-sockets.secret.values

  - name: openldap-credentials
    service: helx-ldap
    values: helx-ldap.secret.values

  - name: "{release}-ldap-sync-secrets"
    service: ldap-sync
    values: ldap-sync.secret.values

  # The bundled CloudPirates PostgreSQL. Only the password is an input; the
  # chart derives the rest from its settings.
  - name: "{release}-ldap-sync-postgres"
    service: ldap-sync
    keys:
      postgres-password: ldap-sync.postgres.auth.password
    derived: [host, port, username, database, uri]

  # The webhook's serving certificate. The chart generates one by default
  # (secret.mode: generate); taking it from values needs mode `values` and the
  # matching CA bundle on the webhook.
  - name: "{release}-user-mutator-tls"
    service: user-mutator
    values: user-mutator.secret.values
    set:
      user-mutator.secret.mode: values
    encoded:
      user-mutator.webhook.caBundle: ca.crt

  - name: "{release}-user-mutator-ldap-password"
    service: user-mutator
    values: user-mutator.ldap.secret.values
