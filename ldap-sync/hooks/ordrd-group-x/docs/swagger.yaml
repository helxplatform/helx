definitions:
  main.HookRequest:
    properties:
      content:
        additionalProperties: true
        type: object
      dn:
        type: string
    type: object
  main.HookResponse:
    properties:
      derived:
        items:
          $ref: '#/definitions/main.SearchSpec'
        type: array
      reset:
        type: boolean
      transformed:
        $ref: '#/definitions/main.TransformedPayload'
    type: object
  main.SearchSpec:
    properties:
      baseDN:
        type: string
      filter:
        type: string
      id:
        type: string
      oneshot:
        description: Oneshot is optional; it is included when applicable.
        type: boolean
      refresh:
        type: integer
    type: object
  main.TransformedPayload:
    properties:
      content:
        additionalProperties: true
        type: object
      dn:
        type: string
    type: object
info:
  contact: {}
paths:
  /hook:
    post:
      consumes:
      - application/json
      description: Accepts a JSON payload with DN and content, applies transformation
      parameters:
      - description: Hook Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.HookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HookResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Hook endpoint for LDAP synchronization
      tags:
      - hook
swagger: "2.0"
