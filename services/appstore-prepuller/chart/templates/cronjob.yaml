apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "appstore-prepuller.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "appstore-prepuller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  schedule: {{ .Values.controller.schedule | quote }}
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: {{ .Values.controller.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.controller.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "appstore-prepuller.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: controller
        spec:
          serviceAccountName: {{ include "appstore-prepuller.serviceAccountName" . }}
          restartPolicy: OnFailure
          containers:
            - name: controller
              image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
              imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              # UNCDSR-182: the controller's own prepuller.py makes no local
              # file writes, but the appstore package it pip-installs
              # (git+https://github.com/helxplatform/appstore.git@pip-installable
              # -- a separate repo from this monorepo's own services/appstore,
              # whose equivalent cache path was already fixed in 2e4b61da)
              # opens requests_cache.CachedSession(cache_name='tycho-registry')
              # with a bare name, which resolves to a sqlite file in the CWD.
              # The Dockerfile's WORKDIR /app holds the application source,
              # now read-only; redirect the CWD to a writable emptyDir
              # instead. The image's ENTRYPOINT uses a path relative to that
              # WORKDIR, so it must be respecified in absolute form here once
              # workingDir changes.
              workingDir: /tmp
              command: ["python", "-u", "/app/prepuller.py"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: PREPULLER_DAEMONSET_NAME
                  value: {{ include "appstore-prepuller.daemonsetName" . }}
                - name: PREPULLER_NAMESPACE
                  value: {{ .Release.Namespace }}
                - name: APP_REGISTRY_REPO
                  value: {{ .Values.appRegistry.repo | quote }}
                - name: APP_REGISTRY_BRANCH
                  value: {{ .Values.appRegistry.branch | quote }}
                - name: APP_REGISTRY_BRAND
                  value: {{ .Values.appRegistry.brand | quote }}
                - name: PREPULLER_INIT_RUN_AS_USER
                  value: "{{- include "appstore-prepuller.intValue" .Values.daemonset.initRunAsUser }}"
              resources:
                {{- toYaml .Values.controller.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
