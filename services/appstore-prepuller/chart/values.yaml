# -- App registry (source of the image list via the tycho API)
appRegistry:
  repo: ""
  branch: ""
  brand: ""

# -- Container securityContext for the controller and the DaemonSet's pause
# container. allowPrivilegeEscalation: false is required by the AKS policy
# that denies privilege escalation, and is harmless elsewhere; keep it when
# overriding. UNCDSR-182: readOnlyRootFilesystem: true is safe here -- the
# pause container only sleeps, and prepuller.py itself only talks to the
# Kubernetes API and the app registry, with no local file writes (confirmed
# by inspection: no open()/tempfile/write()/mkdir calls). It initially looked
# like that made share-nothing read-only root safe outright, but prepuller.py
# pulls in the appstore package (git+https://github.com/helxplatform/appstore.git
# @pip-installable -- a separate repo from this monorepo's own
# services/appstore), whose tycho context opens a requests_cache
# CachedSession with a bare cache name, which resolves to a sqlite file in
# the CWD (the Dockerfile's WORKDIR /app, baked with the application source
# and now read-only). The CronJob's template works around that by
# redirecting the controller's working directory to a writable emptyDir
# rather than depending on that separate repo's own fix landing. The
# pre-pull init containers get their allowPrivilegeEscalation/capabilities
# from the controller itself (prepuller.py's build_init_containers), not from
# this value; they run only "exit 0".
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# -- Controller (CronJob that fetches images and patches the DaemonSet)
controller:
  image:
    repository: containers.renci.org/helxplatform/appstore-prepuller
    # -- Overrides the image tag, which defaults to v<chart appVersion>.
    tag: ""
    pullPolicy: IfNotPresent
  # CronJob schedule (default: every 5 minutes)
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- DaemonSet that actually pre-pulls images (managed by the controller)
daemonset:
  # Empty by default because a parent chart cannot remove a key set here.
  # Platform values files add their own node labels.
  nodeSelector: {}
  # Use affinity to exclude nodes by label, which nodeSelector cannot express.
  affinity: {}
  tolerations:
    - operator: "Exists"
  # UID for the pull init containers. Any numeric UID avoids "no users found"
  # errors from images whose USER is a name (e.g. pgadmin), and it need not
  # exist in the image, so root is unnecessary. "" leaves it unset so the
  # platform assigns one; only use that on OpenShift, whose SCCs reject root.
  initRunAsUser: 65534
  pauseImage: registry.k8s.io/pause:3.9
  resources:
    requests:
      cpu: 10m
      memory: 10Mi
    limits:
      cpu: 50m
      memory: 20Mi
