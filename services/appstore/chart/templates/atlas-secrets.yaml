{{- if and .Values.atlas.enabled .Values.atlas.secret.create }}
{{- /*
The atlas-env secret is discovered by name at launch and cannot be renamed:
tycho scans the namespace for a Secret named `<app>-env` and injects its keys
as env vars on every container of the launched app (see tycho/kube.py). The
name is derived from the app's registry name, so there is no existingSecret
mode and the Secret must live in this namespace. Set atlas.secret.create to
false to own the Secret outside the chart under that same name.

Every key is derived from chart values, so none of them are preserved from the
live Secret, and Helm deletes the Secret instead of leaving it behind when
Atlas is turned off, the release is deleted, or the Secret is handed to
External Secrets or an outside owner. A key whose value is empty is skipped
rather than cleared, leaving whatever the live Secret already holds for it.
*/}}
{{- $secretValues := dict -}}
{{- range $key := list "DATASOURCE_PASSWORD" "DATASOURCE_URL" "DATASOURCE_USERNAME" "FLYWAY_DATASOURCE_PASSWORD" "FLYWAY_DATASOURCE_URL" "FLYWAY_DATASOURCE_USERNAME" -}}
  {{- $value := get $.Values.apps $key -}}
  {{- if $value -}}
    {{- $_ := set $secretValues $key $value -}}
  {{- end -}}
{{- end -}}
{{- range $key, $value := (default (dict) .Values.atlas.secret.values) -}}
  {{- $_ := set $secretValues $key $value -}}
{{- end -}}
{{- $externalSecret := deepCopy (default (dict) .Values.atlas.secret.externalSecret) -}}
{{- $_ := set $externalSecret "targetName" "atlas-env" -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" "atlas-env"
  "values" $secretValues
  "externalSecret" $externalSecret
  "externalSecretName" "atlas-env"
  "preserveKeys" (list)
  "retain" false
) -}}
{{- end }}
