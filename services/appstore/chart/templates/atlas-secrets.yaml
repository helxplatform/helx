{{- if .Values.atlas.enabled }}
{{- /*
The atlas-env Secret is discovered by name at launch and cannot be renamed:
tycho scans the namespace for a Secret named `<app>-env` and injects its keys as
env vars on every container of the launched app (see tycho/kube.py). The name is
derived from the app's registry name, so this contract offers the usual three
modes without a configurable name: existingSecret means the Secret already sits
at atlas-env under someone else's ownership, so the chart supplies that name
itself rather than asking for one.

Every key is derived from chart values, so none of them are preserved from the
live Secret, and Helm deletes the Secret instead of leaving it behind when Atlas
is turned off or the release is deleted. A key whose value is empty is skipped
rather than cleared, leaving whatever the live Secret already holds for it.
*/}}
{{- $externalSecret := deepCopy (default (dict) .Values.atlas.secret.externalSecret) -}}
{{- $_ := set $externalSecret "targetName" "atlas-env" -}}
{{- $existingSecret := "" -}}
{{- if eq (default "" .Values.atlas.secret.mode) "existingSecret" -}}
  {{- $existingSecret = "atlas-env" -}}
{{- end -}}
{{- $mode := include "helx-common.secret.mode.v1" (dict
  "mode" .Values.atlas.secret.mode
  "label" "atlas.secret"
  "existingSecret" $existingSecret
  "externalSecret" $externalSecret
) -}}
{{- /*
The DATASOURCE keys come from .Values.apps, which a deployment sets regardless
of who owns this Secret, so derive them only when values mode owns it: app
configuration is not a declaration that the chart should write the Secret.

atlas.secret.values is passed through unconditionally, because that block is the
caller's own declaration and resources.v1 has to see it to reject values
supplied while another owner holds the Secret.
*/}}
{{- $chartManagedValues := dict -}}
{{- if eq $mode "values" -}}
  {{- range $key := list "DATASOURCE_PASSWORD" "DATASOURCE_URL" "DATASOURCE_USERNAME" "FLYWAY_DATASOURCE_PASSWORD" "FLYWAY_DATASOURCE_URL" "FLYWAY_DATASOURCE_USERNAME" -}}
    {{- $value := get $.Values.apps $key -}}
    {{- if $value -}}
      {{- $_ := set $chartManagedValues $key $value -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range $key, $value := (default (dict) .Values.atlas.secret.values) -}}
  {{- $_ := set $chartManagedValues $key $value -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "mode" .Values.atlas.secret.mode
  "secretValueBlockPath" "atlas.secret"
  "defaultName" "atlas-env"
  "existingSecret" $existingSecret
  "values" $chartManagedValues
  "externalSecret" $externalSecret
  "externalSecretName" "atlas-env"
  "preserveKeys" (list)
  "retain" false
) -}}
{{- end }}
