{{- if .Values.atlas.enabled }}
{{- /*
The `atlas-env` Secret has a fixed name. Tycho scans the namespace for
`<app>-env`, where `<app>` is the app's registry name, and injects its keys as
environment variables into every container of the launched app (see
tycho/kube.py). All secret modes use `atlas-env`; in `existingSecret` mode, it
must already be created outside this chart.

The chart deletes its Secret when Atlas is disabled or the release is deleted.
*/}}
{{- $externalSecret := deepCopy (default (dict) .Values.atlas.secret.externalSecret) -}}
{{- $_ := set $externalSecret "targetName" "atlas-env" -}}
{{- $existingSecret := "" -}}
{{- if eq (default "" .Values.atlas.secret.mode) "existingSecret" -}}
  {{- $existingSecret = "atlas-env" -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "mode" .Values.atlas.secret.mode
  "secretValueBlockPath" "atlas.secret"
  "defaultName" "atlas-env"
  "existingSecret" $existingSecret
  "values" .Values.atlas.secret.values
  "externalSecret" $externalSecret
  "externalSecretName" "atlas-env"
  "preserveKeys" (list)
  "retain" false
) -}}
{{- end }}
