apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-network-policy
spec:
  # Allow resty and appstore-socket pods to communicate with the appstore pod.
  # (Ambassador and nginx are retired in the de-Ambassador design; resty is the
  # edge/data plane.) The podSelector must name the appstore pod: left out, it
  # defaults to every pod in the namespace, which on a cluster that enforces
  # NetworkPolicy denies all traffic not allowed here, cutting off the ingress
  # controller, helx-ldap, ldap-sync's postgres, and the user-mutator webhook.
  podSelector:
    matchLabels:
      {{- include "appstore.selectorLabels" . | nindent 6 }}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: resty
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: appstore-sockets
  policyTypes:
  - Ingress
