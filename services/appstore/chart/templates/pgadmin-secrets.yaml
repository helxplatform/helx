{{- if and .Values.pgadmin.enabled .Values.pgadmin.secret.create }}
{{- /*
The pgadmin-env secret is discovered by name at launch and cannot be renamed:
tycho scans the namespace for a Secret named `<app>-env` and injects its keys
as env vars on every container of the launched app (see tycho/kube.py). The
name is derived from the app's registry name, so there is no existingSecret
mode and the Secret must live in this namespace. Set pgadmin.secret.create
to false to own the Secret outside the chart under that same name.

Only the password is preserved from the live Secret. The remaining keys are
plain configuration and must keep tracking chart values.
*/}}
{{- $externalSecret := deepCopy (default (dict) .Values.pgadmin.secret.externalSecret) -}}
{{- $_ := set $externalSecret "targetName" "pgadmin-env" -}}
{{- /*
The configuration keys come from .Values.apps, which a deployment sets
regardless of who owns this Secret, so derive them only when values mode owns
it: app configuration is not a declaration that the chart should write the
Secret. Gating also stops the generated password below from being produced only
to be discarded; the discarded value never reached the output, so this is about
not generating a credential nobody uses, not about render stability.

pgadmin.secret.values is passed through unconditionally, because that block is
the caller's own declaration and resources.v1 has to see it to reject values
supplied while External Secrets owns the Secret.
*/}}
{{- $mode := include "helx-common.secret.mode.v1" (dict "externalSecret" $externalSecret) -}}
{{- $chartManagedValues := dict -}}
{{- if eq $mode "values" -}}
  {{- $chartManagedValues = dict
    "PGADMIN_DEFAULT_EMAIL" .Values.apps.PGADMIN_EMAIL
    "PGADMIN_CONFIG_SERVER_MODE" "False"
    "PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED" "False"
    "HELX_DB_HOSTNAME" .Values.apps.HELX_DB_HOSTNAME
    "PGADMIN_DISABLE_POSTFIX" .Values.apps.PGADMIN_DISABLE_POSTFIX
    "PGADMIN_LISTEN_PORT" .Values.apps.PGADMIN_LISTEN_PORT
  -}}
{{- end -}}
{{- range $key, $value := (default (dict) .Values.pgadmin.secret.values) -}}
  {{- $_ := set $chartManagedValues $key $value -}}
{{- end -}}
{{- /*
A generated password is only reachable through a cluster-aware upgrade. Argo CD
and other client-side renderers must supply
pgadmin.secret.values.PGADMIN_DEFAULT_PASSWORD or use External Secrets.
*/}}
{{- if and (eq $mode "values") (not (hasKey $chartManagedValues "PGADMIN_DEFAULT_PASSWORD")) -}}
  {{- $_ := set $chartManagedValues "PGADMIN_DEFAULT_PASSWORD" (randAlphaNum 12) -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" "pgadmin-env"
  "values" $chartManagedValues
  "externalSecret" $externalSecret
  "externalSecretName" "pgadmin-env"
  "preserveKeys" (list "PGADMIN_DEFAULT_PASSWORD")
  "requiredKeys" (list "PGADMIN_DEFAULT_PASSWORD")
) -}}
{{- end }}
