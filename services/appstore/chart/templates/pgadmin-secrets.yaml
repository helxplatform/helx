{{- if .Values.pgadmin.enabled }}
{{- /* Existing Secret data is canonical on upgrades; generated values are only fallbacks. */}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" "pgadmin-env"
  "values" (dict
    "PGADMIN_DEFAULT_PASSWORD" (randAlphaNum 12)
    "PGADMIN_DEFAULT_EMAIL" .Values.apps.PGADMIN_EMAIL
    "PGADMIN_CONFIG_SERVER_MODE" "False"
    "PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED" "False"
    "HELX_DB_HOSTNAME" .Values.apps.HELX_DB_HOSTNAME
    "PGADMIN_DISABLE_POSTFIX" .Values.apps.PGADMIN_DISABLE_POSTFIX
    "PGADMIN_LISTEN_PORT" .Values.apps.PGADMIN_LISTEN_PORT
  )
  "requiredKeys" (list "PGADMIN_DEFAULT_PASSWORD")
) -}}
{{- end }}
