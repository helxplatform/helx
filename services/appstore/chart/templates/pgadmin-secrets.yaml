{{- if .Values.pgadmin.enabled }}
{{- /*
The `pgadmin-env` Secret has a fixed name. Tycho scans the namespace for
`<app>-env`, where `<app>` is the app's registry name, and injects its keys as
environment variables into every container of the launched app (see
tycho/kube.py). All secret modes use `pgadmin-env`; in `existingSecret` mode,
it must already be created outside this chart.

Only `PGADMIN_DEFAULT_PASSWORD` is preserved from the live Secret. The other
keys follow the chart values.
*/}}
{{- $externalSecret := deepCopy (default (dict) .Values.pgadmin.secret.externalSecret) -}}
{{- $_ := set $externalSecret "targetName" "pgadmin-env" -}}
{{- $existingSecret := "" -}}
{{- if eq (default "" .Values.pgadmin.secret.mode) "existingSecret" -}}
  {{- $existingSecret = "pgadmin-env" -}}
{{- end -}}
{{- $mode := include "helx-common.secret.mode.v1" (dict
  "mode" .Values.pgadmin.secret.mode
  "secretValueBlockPath" "pgadmin.secret"
  "existingSecret" $existingSecret
  "externalSecret" $externalSecret
) -}}
{{- $secretValues := deepCopy (default (dict) .Values.pgadmin.secret.values) -}}
{{- if eq $mode "values" -}}
  {{- if not (hasKey $secretValues "PGADMIN_CONFIG_SERVER_MODE") -}}
    {{- $_ := set $secretValues "PGADMIN_CONFIG_SERVER_MODE" "False" -}}
  {{- end -}}
  {{- if not (hasKey $secretValues "PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED") -}}
    {{- $_ := set $secretValues "PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED" "False" -}}
  {{- end -}}
{{- end -}}
{{- /*
Helm can preserve a generated password only during a cluster-aware upgrade.
Argo CD and other client-side renderers must supply
pgadmin.secret.values.PGADMIN_DEFAULT_PASSWORD or use External Secrets.
*/}}
{{- if and (eq $mode "values") (not (hasKey $secretValues "PGADMIN_DEFAULT_PASSWORD")) -}}
  {{- $_ := set $secretValues "PGADMIN_DEFAULT_PASSWORD" (randAlphaNum 12) -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "mode" .Values.pgadmin.secret.mode
  "secretValueBlockPath" "pgadmin.secret"
  "defaultName" "pgadmin-env"
  "existingSecret" $existingSecret
  "values" $secretValues
  "externalSecret" $externalSecret
  "externalSecretName" "pgadmin-env"
  "preserveKeys" (list "PGADMIN_DEFAULT_PASSWORD")
  "requiredKeys" (list "PGADMIN_DEFAULT_PASSWORD")
) -}}
{{- end }}
