apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appstore.fullname" . }}-sa
---
# These permissions must only encompass the API calls that Tycho makes.
# Ref: https://github.com/helxplatform/tycho/blob/master/tycho/kube.py
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "appstore.fullname" . }}-role
rules:
# Verbs below are scoped to what tycho/kube.py actually calls, verified against
# a full repo grep of every self.api./self.extensions_api. call site, plus a live
# behavioral test (launch/status/modify/delete cycles for filebrowser, jupyter,
# rstudio-server, pgadmin) with the tightened rules applied to a running cddp-stage
# deployment. get/watch/update/delete (singular) are never called for any of
# these four resources and are intentionally omitted.
- apiGroups:
  - ""
  resources:
    - pods
  verbs:
    - deletecollection
- apiGroups:
  - ""
  resources:
    - services
  verbs:
    - create
    - get
    - list
- apiGroups:
  - ""
  resources:
    - secrets
    - persistentvolumeclaims
  verbs:
    # Listing secrets can be removed after https://github.com/helxplatform/development/issues/852
    - list
- apiGroups:
  - "apps"
  resources:
    - deployments
  verbs:
    - create
    - list
    - patch
    - deletecollection
- apiGroups:
  - "apps"
  resources:
    - replicasets
  verbs:
    - deletecollection
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "appstore.fullname" . }}-rolebinding
subjects:
- kind: ServiceAccount
  name: {{ include "appstore.fullname" . }}-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "appstore.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.useSparkServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: spark
  namespace: {{ .Release.Namespace }}
{{- end }}
