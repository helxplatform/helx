{{- $requiredKeys := list "SECRET_KEY" "APPSTORE_DJANGO_USERNAME" "APPSTORE_DJANGO_PASSWORD" -}}
{{- if .Values.postgresql.enabled -}}
  {{- $requiredKeys = append $requiredKeys "PG_DB_PASSWORD" -}}
{{- end -}}
{{- $migration := dict -}}
{{- if .Values.secret.migration.enabled -}}
  {{- $migration = dict
    "legacyName" (include "appstore.legacySecretName" .)
    "annotation" "appstore.helxplatform.io/migrated-from"
    "keyRenames" (dict "APPSTORE_SECRET_KEY" "SECRET_KEY")
  -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" (include "appstore.managedSecretName" .)
  "mode" .Values.secret.mode
  "errorValuePath" "secret"
  "existingSecret" .Values.secret.existingSecret
  "values" .Values.secret.values
  "externalSecret" .Values.secret.externalSecret
  "externalSecretName" (include "appstore.fullname" .)
  "migration" $migration
  "requiredKeys" $requiredKeys
) -}}
