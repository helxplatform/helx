# Default values for appstore.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  # -- repository where image is located
  repository: containers.renci.org/helxplatform/appstore
  # -- pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  # Set to "" before release!
  tag:

imagePostgresql:
  # -- repository where postgresql image is located
  repository: containers.renci.org/bitnami/postgresql
  # -- pull policy
  pullPolicy: IfNotPresent
  # -- Image tag for postgresql, coordinate this with postgresql dependency.
  tag: 17.6.0-debian-12-r0

# An empty string equates to false, anything else is true.  If debug is true the logLevel is also set
# to DEBUG.
debug: ""

fetcherImage:
  # -- repository where image is located
  repository: helxplatform/url-fetch
  # -- pull policy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

# -- credentials for a private repo
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

secret:
  # -- Which owner writes this Secret: `values` for the chart-managed Secret
  # built from `secret.values`, `existingSecret` for one you create yourself, or
  # `externalSecret` for External Secrets. Declared rather than inferred, so
  # selecting a mode also means clearing the fields belonging to the others.
  mode: values

  # -- Name of a Secret containing the appstore environment variables. When set,
  # the chart does not create or manage a Secret. For an existing legacy release,
  # leave this empty to let the chart migrate the old primary Secret automatically.
  existingSecret: ""

  # -- Configure an ExternalSecret to populate the appstore Secret. This is
  # mutually exclusive with secret.existingSecret. The external backend must be
  # populated separately when migrating an existing release.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to <fullname>-secrets.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- Enable automatic migration from the legacy appstore Secret.
    enabled: true

  # -- Key/value pairs used to create the appstore Secret when neither
  # secret.existingSecret nor secret.externalSecret.enabled is set.
  #
  # Keys are exposed unchanged as appstore container environment variables. Use
  # these same names in this map, in the Secret named by existingSecret, or in
  # the Secret returned by External Secrets.
  #
  # During an upgrade from the legacy chart, existing Secret data takes priority
  # over this map. The map only supplies missing keys; it does not rotate stored
  # passwords or signing keys automatically. Values for keys already present in
  # the persisted Secret are ignored; rotate those credentials in the canonical
  # Secret instead.
  #
  # Values are strings because Kubernetes Secret values are exposed as environment
  # variables. Optional keys should be omitted unless the corresponding feature is
  # enabled.
  #
  # The chart computes and injects these database settings directly from Helm
  # values/templates; *do not* put them in the Secret:
  #   PG_DB_ENGINE: always "postgresql"
  #   PG_DB_DATABASE: derived from postgresql.global.postgresql.auth.database
  #   PG_DB_USERNAME: derived from postgresql.global.postgresql.auth.username
  #   PG_DB_HOST: derived from the release name and PostgreSQL service name
  #   PG_DB_PORT: derived from db.port, normally "5432"
  #   POSTGRES_ENABLED: "true" when postgresql.enabled is true, otherwise "false"
  #
  #   --------
  #
  # Required for a normal appstore deployment:
  #   SECRET_KEY: non-empty random string; 50 characters is the historical chart length, but the app has
  #   no fixed length requirement (use this name, not legacy APPSTORE_SECRET_KEY)
  #   APPSTORE_DJANGO_USERNAME: non-empty username string; "admin" is the historical default
  #   APPSTORE_DJANGO_PASSWORD: password string; no fixed format or length is required
  #
  # PostgreSQL password (when PostgreSQL is enabled):
  #   PG_DB_PASSWORD: application database-user password string; when using the
  #   bundled PostgreSQL chart, it must match postgresql.global.postgresql.auth.password
  #
  # Optional appstore settings:
  #   AUTHORIZED_USERS: comma- or whitespace-separated email addresses and/or usernames
  #   REMOVE_AUTHORIZED_USERS: comma- or whitespace-separated email addresses and/or usernames
  #   CSRF_DOMAINS: comma-separated origins including scheme, for example
  #   "https://app.example.org,https://other.example.org"
  #   EMAIL_HOST: SMTP hostname or IP address
  #   EMAIL_PORT: decimal SMTP port number as a string, for example "25" or "587"
  #   EMAIL_USE_TLS: empty string disables TLS; any non-empty string enables TLS because the app currently
  #   reads this value without boolean parsing
  #   EMAIL_HOST_USER: SMTP username, normally an email address
  #   EMAIL_HOST_PASSWORD: SMTP password string
  #   RECIPIENT_EMAILS: comma-separated email addresses
  #
  # OAuth provider settings (include the group matching each configured provider):
  #   OAUTH_PROVIDERS: comma-separated lowercase provider names with no spaces, e.g. "google,github"
  #   GITHUB_NAME: provider display/name string
  #   GITHUB_CLIENT_ID: provider client ID string
  #   GITHUB_SECRET: provider client secret string
  #   GOOGLE_NAME: provider display/name string
  #   GOOGLE_CLIENT_ID: provider client ID string
  #   GOOGLE_SECRET: provider client secret string
  #   CILOGON_NAME: provider display/name string
  #   CILOGON_CLIENT_ID: provider client ID string
  #   CILOGON_SECRET: provider client secret string
  #   OIDC_NAME: OIDC provider ID/name string; its presence enables OIDC
  #   OIDC_CLIENT_ID: OIDC client ID string
  #   OIDC_SECRET: OIDC client secret string
  #   OIDC_SERVER_URL: OIDC server URL
  #
  # iRODS settings (when the corresponding feature is enabled):
  #   BRAINI_RODS: application-specific iRODS configuration string
  #   NRC_MICROSCOPY_IRODS: application-specific iRODS configuration string
  #   RODS_USERNAME: iRODS username string
  #   RODS_PASSWORD: iRODS password string
  #   IROD_COLLECTIONS: application-specific iRODS collection configuration string
  #   IROD_ZONE: iRODS zone name string
  #   IROD_HOST: iRODS hostname or IP address; omit this key when iRODS is disabled
  #   IROD_PORT: decimal iRODS port number as a string
  #   NFSRODS_HOST: NFS-RoDS hostname or IP address
  values: {}

networkPolicyLabels: {"role": "appstore"}

podAnnotations: {}

# -- Set the log level for the application.  (DEBUG INFO WARNING ERROR CRITICAL)
logLevel: "WARNING"

ldap:
  enabled: false
  uri: "ldap://openldap"
  groupDN: "cn=users,ou=groups,dc=example,dc=org"
  searchBase: "ou=users,dc=example,dc=org"

updateStrategy:
  # -- 'RollingUpdate' or 'Recreate'. Must use Recreate if mounting PVCs due to multi-attach errors.
  type: Recreate

serviceAccount:
  # -- specifies whether a service account should be created
  create: true
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}

service:
  type: ClusterIP
  port: 80
  name: http

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 300Mi

security:
  isolatedApps: true
  # In-namespace pods that app pods are allowed to egress to. Each entry is a
  # map of pod labels (AND-matched within an entry, OR-matched across entries).
  # Empty by default, so apps are fully isolated from other in-namespace pods.
  # External egress and DNS remain allowed regardless.
  # Example: allow apps to reach a postgres database:
  #   appEgressAllowedPods:
  #     - app.kubernetes.io/name: my-postgres
  appEgressAllowedPods: []
  # Labels identifying the cluster DNS pods, used to permit DNS egress from
  # app pods. When set, egress is allowed to any pod carrying these labels
  # on any port. When empty, falls back to permitting egress on common DNS
  # ports (53, 5353, 1053) to any destination — works out of the box on most
  # clusters but is broader than a label-based rule.
  # Examples:
  #   Stock Kubernetes / CoreDNS:  {k8s-app: kube-dns}
  #   OpenShift:                   {dns.operator.openshift.io/daemonset-dns: default}
  dnsPodSelector: {}

# -- Choose http or https for the protocol that is used by external users to access
# the appstore web service.
ACCOUNT_DEFAULT_HTTP_PROTOCOL: http

# -- Set environment variables from a file.
SET_BUILD_ENV_FROM_FILE: false

nodeSelector: {}

tolerations: []

affinity: {}

ambassador:
   # -- register appstore with ambassador flag: <True or False>
   flag: true

# -- set the theme for appstore (bdc, braini, restartr, scidas)
djangoSettings: helx
# -- Allow for a custom entrypoint command via the values file.
appstoreEntrypointArgs: "make start"

gunicorn:
  # -- Set the number of gunicorn workers.  (2*CPU)+1 is recommended.
  workers: 5

graderApiUrl: ""

django:
  # -- Note that these only run on a user's primary alias.
  # If a user has primary@cs.unc.edu as their primary alias,
  # and secondary@renci.org as a secondary alias, they will only
  # be whitelisted automatically if cs.unc.edu emails are allowed.
  # ex. Whitelist all RENCI emails - "^[A-Za-z0-9._%+-]+@renci\\.org$"
  # ex. Whitelist all UNC emails - "^[A-Za-z0-9._%+-]+@([A-Za-z0-9.-]+\\.)?unc\\.edu$"
  # ex. Whitelist CS dept. (grad./prof.) UNC emails - "^[A-Za-z0-9._%+-]+@cs\\.unc\\.edu$"
  AUTO_WHITELIST_PATTERNS: []

  # Add arbitrary product links that appear in the UI header navbar.
  # Ex: [{"name": "Gitea", "url": "https://gitea.com"}]
  PRODUCT_LINKS: []

  # -- Specify the git branch to use for HeLx app specifications.  When
  # declaring 'tycho.externalAppRegistryRepo' leave this as an empty string.
  DOCKSTORE_APPS_BRANCH: "v1.6.0"

  # -- show Django log in fields (true | false)
  ALLOW_DJANGO_LOGIN: ""
  # -- show SAML log in fields (true | false)
  ALLOW_SAML_LOGIN: ""

  # -- Specify URL to use for the "Image Download" link on the top part of website.
  IMAGE_DOWNLOAD_URL: ""
  # -- idle timeout for user web session
  SESSION_IDLE_TIMEOUT: "2592000" # 30 days

  # -- should be 'live' unless you are doing some kind of development
  DEV_PHASE: "live"

saml:
  cache:
    enabled: false
    claimName: "saml-cache"
    storageSize: "20M"
    storageClass: ""
    FETCH_FILE: "/data/saml_metadata.xml"
    FETCH_INTERVAL: "60000"
    APPSTORE_DIRECTORY: "/saml"
    APPSTORE_FILE: "saml_metadata.xml"
  AUTHORITY_URL: ""
  ASSERTION_URL: ""
  ENTITY_ID: ""
  # -- IdP entity ID to select from the metadata source (required when the source is a federation aggregate, e.g. "https://sso.unc.edu/idp")
  IDP_ENTITY_ID: ""
  # -- URL slug under /accounts/saml/<slug>/ for the SAML provider (e.g. "unc")
  PROVIDER_SLUG: "saml"
  # -- human-readable name for the SAML provider, shown on the login page
  PROVIDER_NAME: "Single Sign-On"

irods:
  # -- enable branded iRODS support; provide its environment variables through
  # the selected appstore Secret.
  enabled: false

# Non-secret configuration for the optional NFS-RoDS integration. Its appstore
# connection settings and credentials belong in the selected appstore Secret.
irodsUnbranded:
  enabled: false
  IROD_USER_VALUES: {}

atlas:
  # -- Disabling will turn off the creation of secrets/configmaps for Atlas
  enabled: false
  # The launched Atlas app spec requires the Secret to be named `atlas-env`.
  secret:
    # -- Selects who manages `atlas-env`: `values` lets the chart create it
    # from the keys below, `existingSecret` uses an externally managed Secret,
    # and `externalSecret` delegates it to External Secrets.
    mode: values
    # -- Key/value pairs for `atlas-env`. Provide Atlas and Flyway database
    # connection settings here; each key becomes an environment variable in
    # the launched Atlas application.
    # Required values for `atlas-env`:
    #  DATASOURCE_URL: -- Atlas database URL
    #  DATASOURCE_USERNAME: -- Atlas database username
    #  DATASOURCE_PASSWORD: -- Atlas database password
    #  FLYWAY_DATASOURCE_URL: -- Flyway database URL
    #  FLYWAY_DATASOURCE_USERNAME: -- Flyway database username
    #  FLYWAY_DATASOURCE_PASSWORD: -- Flyway database password
    values: {}
    # -- Configure an ExternalSecret that populates `atlas-env`. Mutually
    # exclusive with the chart-managed keys above.
    externalSecret:
      enabled: false
      refreshInterval: 1h
      secretStoreRef:
        name: vault
        kind: SecretStore
      remoteRef: ""
imagej:
  # -- Disabling will turn off the creation of secrets/configmaps for ImageJ
  enabled: false
octave:
  # -- Disabling will turn off the creation of secrets/configmaps for Octave
  enabled: false
pgadmin:
  # -- Disabling will turn off the creation of secrets/configmaps for PgAdmin
  enabled: true
  # The launched pgAdmin app spec requires the Secret to be named `pgadmin-env`.
  secret:
    # -- Selects who manages `pgadmin-env`: `values` lets the chart create it
    # from the keys below, `existingSecret` uses an already created Secret,
    # and `externalSecret` delegates it to External Secrets.
    mode: values
    # -- Key/value pairs for `pgadmin-env`; each key becomes an environment
    # variable in the launched pgAdmin application.
    # Required values for `pgadmin-env`:
    #  PGADMIN_DEFAULT_EMAIL: -- pgAdmin user email
    #  HELX_DB_HOSTNAME: -- database hostname for pgAdmin clients
    #  PGADMIN_DISABLE_POSTFIX: -- disable postfix in the pgAdmin container
    #  PGADMIN_LISTEN_PORT: -- pgAdmin listen port
    # Optional values for `pgadmin-env`:
    #  PGADMIN_CONFIG_SERVER_MODE: -- defaults to "False"
    #  PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: -- defaults to "False"
    #  PGADMIN_DEFAULT_PASSWORD: -- generated on install and preserved during
    #    cluster-aware upgrades; set explicitly for client-side renderers such
    #    as Argo CD, or use `externalSecret`.
    values: {}
    # -- Configure an ExternalSecret that populates `pgadmin-env`. Mutually
    # exclusive with the chart-managed keys above.
    externalSecret:
      enabled: false
      refreshInterval: 1h
      secretStoreRef:
        name: vault
        kind: SecretStore
      remoteRef: ""
webtop:
  # -- Disabling will turn off the creation of secrets/configmaps for Webtop
  enabled: false

apps:
  DICOMGH_GOOGLE_CLIENT_ID: ""
  # -- PUID variable in webtop specifies the UID to switch the user to after
  # initialization.
  WEBTOP_PUID: "1000"
  # -- PGID variable in webtop specifies the GID to switch the user to after
  # initialization.
  WEBTOP_PGID: "1000"

replicaCount: 1

# -- Settings for django sqlite3 db file persistence, if postgresql is not enabled (postgresql.enabled: false).
sqliteStorage:
  # -- If a claim name is not specified, it defaults to appstore-oauth-pvc.
  claimName:
  storageClass:

# -- Settings for django logs persistence.
logsStorageAppstore:
  createPVC: false
  # -- Set to true if a claim has been created outside of the appstore chart.
  existingClaim: false
  # -- Specify the claim name if it pre-exists or it defaults to appstore-logs-pvc.
  claimName:
  storageSize: 2Gi
  storageClass:

userStorage:
  # -- Create a PVC for user's files.  If false then the PVC needs to be created
  # outside of the appstore chart.
  createPVC: true
  retain: true
  storageSize: 10Gi
  storageClass:
  nfs:
    createPV: false
    path:
    server:

# Add any extra environment variables not already defined in the chart.
extraEnv: {}

# -- Set to true, when using blackbalsam.
useSparkServiceAccount: false

tycho:
  # -- How Tycho-launched apps are routed. "proxy" (default on this branch):
  # ClusterIP + /private prefix, backend resolved by an external reverse proxy
  # (resty) via appstore's /api/v1/private-route/ resolver — the de-Ambassador
  # design. "ambassador" (legacy): emit the Ambassador Mapping annotation when
  # Ambassador is present. "none": no routing wiring.
  appRoutingMode: proxy
  # -- Application processes launched will run as this user.
  runAsUser: 0
  # -- Application processes launched will have this group permissions.
  runAsGroup: 0
  # -- Application processes launched will also be part of this supplimentary group.
  fsGroup: 0
  # -- Enable trash-cli functionality in tycho-launched apps
  enableTrashCli: false
  # -- Start the init container to take care of any needed tasks before the
  # main container is started.  This can be to create certain directories or
  # set file permissions.
  enableInitContainer: true
  # -- The image repository to use for HeLx app init containers.
  initImageRepository: busybox
  # -- The image tag to use for HeLx app init containers.
  initImageTag: latest
  # -- Init processes will run as this user.
  initRunAsUser: 0
  # -- Init processes will have this group permissions.
  initRunAsGroup: 0
  # -- "Userless" init processes will run as this user.
  initRunAsNobodyUser: 524288
  # -- "Userless" init processes will have these group permissions.
  initRunAsNobodyGroup: 524288
  # -- Create Home and shared directories for users.
  createHomeDirs: true
  # -- directory that will be used to mount user's home directories in
  parent_dir: "/home"
  # -- Name of directory to use for a user's home directory.  If null then the
  # user's username will be used.
  subpath_dir: null
  # -- name of directory to use for shared data
  shared_dir: "shared"
  # -- Resource for Tycho init container. Defaults cpus|250m memory|250Mi
  init:
    resources:
      cpus: 250m
      memory: 250Mi
  # -- The GPU resource name that a container can utilize.  Typically this is
  # "nvidia.com/gpu", but other types exist, such as "nvidia.com/mig-1g.5gb"
  # and other manufacturers have their own types.
  GPUResourceName: "nvidia.com/gpu"
  # -- Enable/disable the external app registry file for Tycho.
  externalAppRegistryEnabled: false
  # -- Can be set to a git repo URL for fetching the app registry file or
  # defaults file.  Something in the form of
  # 'https://github.com/helxplatform/helx-apps/raw'.
  externalAppRegistryRepo: "https://github.com/helxplatform/helx-apps/raw"
  # -- The branch that is appended to externalAppRegistryRepo when the external
  # app registry is enabled. The full URL, using the repository below, would be
  # 'https://github.com/helxplatform/helx-apps/raw/master/app-registry.yaml'.
  # The default value is the AppVersion of this chart prefixed with a 'v'
  # (ex. v2.0.0).
  externalAppRegistryBranch:
  externalAppRegistryAppSpecsDir: "app-specs"

global:
  # -- container image registry to use for Bitnami images
  imageRegistry: "containers.renci.org"
  security:
    # -- load container images from non-Bitnami container registry servers
    allowInsecureImages: true
  # -- the name of the PVC to use for user's files
  stdnfsPvc: stdnfs
  # -- specify the id of the ambassador for Tycho-launched services.
  ambassador_id:
  # -- specify the service name for ambassador
  ambassador_service_name: ambassador
  # -- specify the mapping name for ambassador
  ambassador_mapping_name: appstore-mapping

#############################################################################
# -- appstore database settings
db:
  name: appstore
  port: 5432

# -- postgresql settings
postgresql:
  enabled: true
  global:
    # -- postgresql credentials
    postgresql:
      auth:
        database: "appstore-oauth"
        username: "renci"
  # -- postgresql labels
  primary:
    labels: {"np-label": "appstore-db"}
    podLabels: {"np-label": "appstore-db"}
  # -- postgresql logs
  audit:
    logHostname: true
    logConnections: true
  # -- postgresql persistence storage
  persistence:
    existingClaim: "appstore-postgresql-pvc"
    storageClass:
  volumePermissions:
    enabled: true
  # -- enable/disable postgresql network policy, allows traffic to and from appstore pod only.
  networkPolicyEnabled: true
