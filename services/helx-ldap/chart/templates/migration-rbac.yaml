{{- if .Values.openldap.migration.enabled }}
{{- $migrationName := include "helx-ldap.migrationName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $migrationName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helx-ldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-50"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $migrationName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helx-ldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-49"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - statefulsets/scale
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $migrationName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helx-ldap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-48"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $migrationName }}
subjects:
  - kind: ServiceAccount
    name: {{ $migrationName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
