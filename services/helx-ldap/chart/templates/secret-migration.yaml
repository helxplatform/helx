{{- if .Values.secret.migration.enabled }}
{{- if not .Release.IsUpgrade }}
  {{- fail "helx-ldap: secret.migration.enabled is only valid during a Helm upgrade" -}}
{{- end }}
{{- if .Values.secret.externalSecret.enabled }}
  {{- fail "helx-ldap: secret.migration.enabled cannot be used with secret.externalSecret.enabled" -}}
{{- end }}
{{- $legacySecretName := required "helx-ldap: secret.migration.legacySecret is required" .Values.secret.migration.legacySecret -}}
{{- $targetName := include "helx-ldap.credentialsSecretTargetName" . -}}
{{- $configuredSecret := required "helx-ldap: secret.existingSecret must name the migration target Secret" .Values.secret.existingSecret -}}
{{- if ne $configuredSecret $targetName }}
  {{- fail (printf "helx-ldap: secret.existingSecret must be %q during Secret migration, got %q" $targetName $configuredSecret) -}}
{{- end }}
{{- if eq $legacySecretName $targetName }}
  {{- fail (printf "helx-ldap: secret.migration.legacySecret must differ from target Secret %q" $targetName) -}}
{{- end }}
{{- $legacySecret := lookup "v1" "Secret" .Release.Namespace $legacySecretName -}}
{{- if not $legacySecret }}
  {{- fail (printf "helx-ldap: legacy Secret %q was not found in namespace %q" $legacySecretName .Release.Namespace) -}}
{{- end }}
{{- $payload := include "helx-common.secret.payload.v1" (dict
  "root" .
  "targetName" $targetName
  "values" (dict)
  "migration" (dict "legacyName" $legacySecretName)
) | fromYaml -}}
{{- $data := default (dict) $payload.data -}}
{{- range $key := (list "LDAP_ADMIN_PASSWORD" "LDAP_CONFIG_ADMIN_PASSWORD") }}
  {{- if empty (default "" (get $data $key)) }}
    {{- fail (printf "helx-ldap: legacy Secret %q must contain non-empty key %q" $legacySecretName $key) -}}
  {{- end }}
{{- end }}
{{- $annotations := deepCopy (default (dict) $payload.annotations) -}}
{{- $_ := set $annotations "helm.sh/hook" "pre-upgrade" -}}
{{- $_ := set $annotations "helm.sh/hook-weight" "-20" -}}
{{- $_ := set $annotations "helm.sh/hook-delete-policy" "before-hook-creation" -}}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $targetName }}
  annotations:
{{ toYaml $annotations | nindent 4 }}
type: {{ default "Opaque" $legacySecret.type }}
data:
{{ toYaml $data | nindent 2 }}
{{- end }}
