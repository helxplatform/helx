{{- $targetName := include "helx-ldap.credentialsSecretTargetName" . -}}
{{- $selectedName := include "helx-ldap.credentialsSecret" . -}}
{{- if ne $selectedName $targetName -}}
  {{- fail (printf "helx-ldap: selected Secret %q must match openldap.global.existingSecret %q because the upstream OpenLDAP chart consumes that value directly" $selectedName $targetName) -}}
{{- end -}}
{{- $requiredKeys := list "LDAP_ADMIN_PASSWORD" "LDAP_CONFIG_ADMIN_PASSWORD" -}}
{{- if .Values.configuration.appstoreAccount.enabled -}}
  {{- $requiredKeys = append $requiredKeys "LDAP_APPSTORE_PASSWORD" -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" $targetName
  "mode" .Values.secret.mode
  "secretValueBlockPath" "secret"
  "existingSecret" .Values.secret.existingSecret
  "values" .Values.secret.values
  "externalSecret" .Values.secret.externalSecret
  "externalSecretName" (include "helx-ldap.fullname" .)
  "requiredKeys" $requiredKeys
) -}}
