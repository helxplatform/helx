# Default values for helx-ldap.

secret:
  # -- Which owner writes the credentials Secret: `values` for a chart-managed
  # Secret built from `secret.values`, `existingSecret` for a caller-managed
  # Secret, or `externalSecret` for External Secrets.
  mode: values

  # -- Name of a caller-managed HeLx LDAP credentials Secret containing
  # LDAP_ADMIN_PASSWORD, LDAP_CONFIG_ADMIN_PASSWORD and LDAP_APPSTORE_PASSWORD.
  # Set this only when `secret.mode` is `existingSecret`.
  existingSecret: ""

  # -- Key/value pairs used to create the chart-managed HeLx LDAP credentials
  # Secret. Set these only when `secret.mode` is `values`.
  # Required keys:
  #   LDAP_ADMIN_PASSWORD: password for the HeLx LDAP directory administrator
  #   LDAP_CONFIG_ADMIN_PASSWORD: password for the cn=config administrator
  #   LDAP_APPSTORE_PASSWORD: password for the appstore account
  #     (configuration.appstoreAccount), which appstore binds as
  # Argo CD users should provide stable encrypted values or select ESO mode.
  values: {}

  # -- Configure an ExternalSecret to populate the HeLx LDAP credentials Secret.
  # Set `secret.mode` to `externalSecret` when using this configuration.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to
    # openldap.global.existingSecret.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- Enable the one-time credentials Secret migration during a Helm upgrade.
    # It requires `secret.mode: existingSecret`, and the target remains
    # caller-managed through secret.existingSecret.
    enabled: false
    # -- Name of the credentials Secret from the previous deployment. Verify it
    # in the namespace before upgrading; this is not deleted automatically.
    legacySecret: ""

openldap:
  # Upstream leaves this disabled. Enabled, it applies to every OpenLDAP
  # container (init-schema, init-tls-secret, openldap), which is how
  # allowPrivilegeEscalation: false reaches them; the AKS policy that denies
  # privilege escalation requires it. Upstream's runAsUser and runAsNonRoot come
  # with it and are spelled out here, because a null set here is dropped before
  # it reaches the subchart when this chart is itself a dependency of the
  # umbrella. 1001 is the OpenLDAP image's own user, so only the two init
  # containers change identity; they write only to emptyDir volumes, which
  # podSecurityContext.fsGroup 1001 keeps writable. On OpenShift, set enabled
  # to false so the SCC allocates IDs.
  # UNCDSR-182: confirmed via a live crash (bind(6) failed errno=2 -- slapd
  # couldn't create its pid/args files) and direct image inspection
  # (jpgouin/openldap, a Bitnami-pattern build) that a single emptyDir
  # mounted over the whole /opt/bitnami/openldap/var directory wipes out the
  # var/run subdirectory baked into the image, which slapd needs to already
  # exist (libopenldap.sh references var/run/slapd.{args,pid} directly).
  # Mounting an emptyDir at that subdirectory directly, instead of its
  # parent, avoids wiping anything else out while still making it writable.
  #
  # var/data needs no volume at all: it's a symlink (baked into the image) to
  # /bitnami/openldap/data, already inside the `persistence` PVC this chart
  # already mounts at /bitnami/openldap -- confirmed via a real test pod that
  # Kubernetes resolves through a symlink when preparing a mount at its
  # location, so writes through it already land on that existing, persisted
  # PVC without any extra mount.
  #
  # UNCDSR-182 correction: /opt/bitnami/openldap/share is NOT read-only after
  # all. On a genuinely fresh install (empty /bitnami/openldap, no live
  # cluster to test against), libopenldap.sh generates
  # /opt/bitnami/openldap/share/slapd.ldif on first start; that write was
  # missed earlier because it was verified only against cdsr-stage, whose
  # data volume already held an initialized directory, which skips this step
  # entirely (reported against #66 by PhillipOwen, reproduced with
  # jpgouin/openldap:2.6.9-fix --read-only). Seed an emptyDir from the
  # image's own copy of share/ via an init container -- the same seed-then-
  # mount-over pattern Tycho's emptyDirSeeded:// uses for this exact problem
  # (see services/appstore/appstore/tycho/model.py) -- rather than granting
  # the main container a writable root. The init container mounts the seed
  # volume at a staging path, not at /opt/bitnami/openldap/share itself, so
  # it can still see the image's real share/ as its copy source; only the
  # main container's mount replaces share/ outright.
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    runAsUser: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
  initContainers:
    - name: seed-openldap-share
      image: '{{ include "openldap.image" . }}'
      imagePullPolicy: '{{ .Values.image.pullPolicy }}'
      command:
        - sh
        - -c
        # Not "cp -a": preserving the source directory's own timestamps needs
        # CAP_FOWNER as a non-owning user, which capabilities.drop: [ALL]
        # denies -- cp still copies every file, but exits 1 on that failed
        # attribute-preservation step, which Kubernetes then reports as a
        # crash. Plain -r copies the content without touching timestamps.
        - cp -r /opt/bitnami/openldap/share/. /openldap-share-seed/
      securityContext:
        allowPrivilegeEscalation: false
        runAsUser: 1001
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: openldap-share
          mountPath: /openldap-share-seed
  extraVolumes:
    - name: openldap-var-run
      emptyDir: {}
    - name: openldap-share
      emptyDir: {}
  extraVolumeMounts:
    - name: openldap-var-run
      mountPath: /opt/bitnami/openldap/var/run
    - name: openldap-share
      mountPath: /opt/bitnami/openldap/share

  # Keep the service name stable for HeLx consumers, including appstore's
  # default ldap://openldap URI.
  fullnameOverride: openldap

  replicaCount: 1

  global:
    ldapDomain: example.org
    # -- Secret name consumed by the upstream OpenLDAP chart. This is the fixed
    # target name for each credentials ownership mode. In existingSecret mode it
    # must match secret.existingSecret; in externalSecret mode it must match
    # secret.externalSecret.targetName when that value is set.
    existingSecret: openldap-credentials

  # The develop configuration intentionally permits anonymous HeLx LDAP binds. The
  # anonymous-access ACL below still controls what anonymous users can read.
  env:
    LDAP_ALLOW_ANON_BINDING: "yes"

  resources:
    requests:
      cpu: 500m
      memory: 500M
    limits:
      cpu: "1"
      memory: 500M

  # On OpenShift, set podSecurityContext.enabled and
  # containerSecurityContext.enabled to false so the SCC can allocate IDs from
  # the namespace's range. This is the wrapper equivalent of the develop
  # branch's generated fsGroup: null value, which a parent chart cannot pass
  # through to this dependency.

  persistence:
    enabled: true
    # -- Existing PVC to mount instead of creating a StatefulSet
    # volumeClaimTemplate. Leave empty for a fresh installation. Once a legacy
    # PVC is adopted, keep this value set permanently.
    existingClaim: ""

  migration:
    # -- Enable the one-time existing HeLx LDAP PVC migration during a Helm
    # upgrade. The migration hook stops and replaces the old StatefulSet
    # controller; it does not copy or delete the PVC.
    enabled: false
    # -- Name of the PVC that must be adopted. Set persistence.existingClaim to
    # the same value during migration.
    legacyPvc: ""
    # -- Optional old StatefulSet name. When empty, the migration hook discovers
    # HeLx LDAP StatefulSets using the Helm release and OpenLDAP labels.
    legacyStatefulSet: ""
    image:
      # -- Image containing kubectl and /bin/sh used by the pre-upgrade hook.
      repository: registry.k8s.io/kubectl
      # -- Migration hook image tag.
      tag: v1.31.0
      # -- Image pull policy for the migration hook.
      pullPolicy: IfNotPresent
    # -- Container securityContext for the migration hook. allowPrivilegeEscalation:
    # false is required by the AKS policy that denies privilege escalation.
    securityContext:
      allowPrivilegeEscalation: false
    job:
      # -- Number of retries for the migration hook Job.
      backoffLimit: 0
      # -- Maximum runtime for the migration hook Job.
      activeDeadlineSeconds: 600

  replication:
    enabled: false

  # These optional upstream components are not part of the HeLx LDAP service.
  phpldapadmin:
    enabled: false
  ltb-passwd:
    enabled: false
  test:
    enabled: false

configuration:
  # Apply the HeLx cn=config LDIFs as a Helm post-install/post-upgrade Job.
  enabled: true

  # The config administrator DN used by the upstream chart by default.
  configDN: cn=admin,cn=config

  # These are derived from openldap.global.ldapDomain and adminUser when empty.
  # Set them explicitly when the HeLx LDAP deployment uses custom DNs.
  baseDN: ""
  adminDN: ""

  # Choose which ACL set the configuration Job writes to the database's
  # olcAccess. On every install and upgrade the Job compares the live
  # olcAccess with the chosen set and replaces it if they differ. Any
  # hand-edited ACLs on that database are overwritten.
  #
  # In both sets, userPassword and shadowLastChange are never readable
  # anonymously. Anonymous clients may only use userPassword to authenticate
  # a simple bind. Users can change their own password, and the admin DN
  # can write everything.
  #
  # enabled: true also lets anonymous clients read the entries under
  # ou=users and ou=groups. The user-mutator nslcd sidecar needs this
  # because it binds anonymously.
  #
  # enabled: false lets authenticated clients read those entries instead of
  # anonymous ones. It also replaces anonymous ACLs that an earlier upgrade
  # applied. The user-mutator LDAP config has no bind DN, so user and group
  # lookups in user app pods stop working. Set
  # openldap.env.LDAP_ALLOW_ANON_BINDING to "no" as well to refuse
  # anonymous binds outright.
  anonymousAccess:
    enabled: true

  # A dedicated LDAP account appstore binds as instead of the directory admin,
  # to create accounts at first login (appstore ldap.provision). It can only:
  #   - read users and groups;
  #   - add entries in its own branch, ou=<externalOU>,ou=users, with values
  #     limited by the constraint overlay (uidNumber, gidNumber, home and
  #     supplementalGroups patterns below; no runAsUser, runAsGroup, fsGroup
  #     or password);
  #   - change or delete only entries it created (creatorsName);
  #   - add, never remove, memberUid values on the group.
  # A unique overlay also keeps uid and uidNumber unique across ou=users, for
  # every writer, ldap-sync included. The Job creates the account, its branch
  # and the group, keeps the account's password current from the credentials
  # Secret key LDAP_APPSTORE_PASSWORD (required), and applies the ACLs that
  # include these rules. There is no switch to turn it off: appstore would
  # then need the directory admin's password.
  appstoreAccount:
    # -- The account is cn=<name>,<baseDN>.
    name: appstore
    # -- The branch appstore adds accounts to: ou=<externalOU>,ou=users,<baseDN>.
    externalOU: external
    # -- The posixGroup appstore may add members to (cn=<group>,ou=groups,<baseDN>);
    # created by the Job when missing.
    group: helx-users
    groupGidNumber: 1025
    # -- Patterns (regular expressions) values in the branch must match.
    uidNumberPattern: "^20[0-9]{5}$"
    gidNumberPattern: "^1025$"
    homeDirectoryPattern: "^/home/[a-z0-9][a-z0-9._-]*$"
    supplementalGroupsPattern: "^0$"

  # Module paths for the overlays the appstore account uses.
  uniqueModulePath: /opt/bitnami/openldap/lib/openldap/unique.so
  constraintModulePath: /opt/bitnami/openldap/lib/openldap/constraint.so

  # The Job connects to openldap.fullnameOverride by default. Set this only
  # when the service name is intentionally different from the chart name.
  serviceName: ""

  # By default the Job uses the same image as the OpenLDAP dependency. The
  # image must contain /bin/sh, ldapsearch, and ldapmodify.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  memberofModulePath: /opt/bitnami/openldap/lib/openldap/memberof.so

  job:
    backoffLimit: 6
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 300
    # On OpenShift, set securityContext.enabled and podSecurityContext.enabled
    # to false so the SCC can allocate IDs from the namespace's range. A null
    # from a parent chart does not remove these defaults.
    securityContext:
      # -- Render the configuration container's securityContext. The remaining
      # keys are passed through as the container securityContext.
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      # UNCDSR-182: readOnlyRootFilesystem: true is safe here -- configure.sh
      # only runs ldapsearch/ldapmodify against the LDAP server and reads its
      # LDIFs from the read-only configure-script/ldif volume mounts, with no
      # local file writes.
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      # -- Render the configuration pod's securityContext. The remaining keys
      # are passed through as the pod securityContext.
      enabled: true
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
