# Default values for helx-ldap.

secret:
  # -- Which owner writes the credentials Secret: `values` for a chart-managed
  # Secret built from `secret.values`, `existingSecret` for a caller-managed
  # Secret, or `externalSecret` for External Secrets.
  mode: values

  # -- Name of a caller-managed HeLx LDAP credentials Secret containing
  # LDAP_ADMIN_PASSWORD and LDAP_CONFIG_ADMIN_PASSWORD. Set this only when
  # `secret.mode` is `existingSecret`.
  existingSecret: ""

  # -- Key/value pairs used to create the chart-managed HeLx LDAP credentials
  # Secret. Set these only when `secret.mode` is `values`.
  # Required keys:
  #   LDAP_ADMIN_PASSWORD: password for the HeLx LDAP directory administrator
  #   LDAP_CONFIG_ADMIN_PASSWORD: password for the cn=config administrator
  # Argo CD users should provide stable encrypted values or select ESO mode.
  values: {}

  # -- Configure an ExternalSecret to populate the HeLx LDAP credentials Secret.
  # Set `secret.mode` to `externalSecret` when using this configuration.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to
    # openldap.global.existingSecret.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- Enable the one-time credentials Secret migration during a Helm upgrade.
    # It requires `secret.mode: existingSecret`, and the target remains
    # caller-managed through secret.existingSecret.
    enabled: false
    # -- Name of the credentials Secret from the previous deployment. Verify it
    # in the namespace before upgrading; this is not deleted automatically.
    legacySecret: ""

openldap:
  # Keep the service name stable for HeLx consumers, including appstore's
  # default ldap://openldap URI.
  fullnameOverride: openldap

  replicaCount: 1

  global:
    ldapDomain: example.org
    # -- Secret name consumed by the upstream OpenLDAP chart. This is the fixed
    # target name for each credentials ownership mode. In existingSecret mode it
    # must match secret.existingSecret; in externalSecret mode it must match
    # secret.externalSecret.targetName when that value is set.
    existingSecret: openldap-credentials

  # The develop configuration intentionally permits anonymous HeLx LDAP binds. The
  # anonymous-access ACL below still controls what anonymous users can read.
  env:
    LDAP_ALLOW_ANON_BINDING: "yes"

  resources:
    requests:
      cpu: 500m
      memory: 500M
    limits:
      cpu: "1"
      memory: 500M

  # On OpenShift, set podSecurityContext.enabled to false so the SCC can
  # allocate the pod security context. This is the wrapper equivalent of the
  # develop branch's generated fsGroup: null value.

  persistence:
    enabled: true
    # -- Existing PVC to mount instead of creating a StatefulSet
    # volumeClaimTemplate. Leave empty for a fresh installation. Once a legacy
    # PVC is adopted, keep this value set permanently.
    existingClaim: ""

  migration:
    # -- Enable the one-time existing HeLx LDAP PVC migration during a Helm
    # upgrade. The migration hook stops and replaces the old StatefulSet
    # controller; it does not copy or delete the PVC.
    enabled: false
    # -- Name of the PVC that must be adopted. Set persistence.existingClaim to
    # the same value during migration.
    legacyPvc: ""
    # -- Optional old StatefulSet name. When empty, the migration hook discovers
    # HeLx LDAP StatefulSets using the Helm release and OpenLDAP labels.
    legacyStatefulSet: ""
    image:
      # -- Image containing kubectl and /bin/sh used by the pre-upgrade hook.
      repository: registry.k8s.io/kubectl
      # -- Migration hook image tag.
      tag: v1.31.0
      # -- Image pull policy for the migration hook.
      pullPolicy: IfNotPresent
    job:
      # -- Number of retries for the migration hook Job.
      backoffLimit: 0
      # -- Maximum runtime for the migration hook Job.
      activeDeadlineSeconds: 600

  replication:
    enabled: false

  # These optional upstream components are not part of the HeLx LDAP service.
  phpldapadmin:
    enabled: false
  ltb-passwd:
    enabled: false
  test:
    enabled: false

configuration:
  # Apply the HeLx cn=config LDIFs as a Helm post-install/post-upgrade Job.
  enabled: true

  # The config administrator DN used by the upstream chart by default.
  configDN: cn=admin,cn=config

  # These are derived from openldap.global.ldapDomain and adminUser when empty.
  # Set them explicitly when the HeLx LDAP deployment uses custom DNs.
  baseDN: ""
  adminDN: ""

  # Choose which ACL set the configuration Job writes to the database's
  # olcAccess. On every install and upgrade the Job compares the live
  # olcAccess with the chosen set and replaces it if they differ. Any
  # hand-edited ACLs on that database are overwritten.
  #
  # In both sets, userPassword and shadowLastChange are never readable
  # anonymously. Anonymous clients may only use userPassword to authenticate
  # a simple bind. Users can change their own password, and the admin DN
  # can write everything.
  #
  # enabled: true also lets anonymous clients read the entries under
  # ou=users and ou=groups. The user-mutator nslcd sidecar needs this
  # because it binds anonymously.
  #
  # enabled: false lets authenticated clients read those entries instead of
  # anonymous ones. It also replaces anonymous ACLs that an earlier upgrade
  # applied. The user-mutator LDAP config has no bind DN, so user and group
  # lookups in user app pods stop working. Set
  # openldap.env.LDAP_ALLOW_ANON_BINDING to "no" as well to refuse
  # anonymous binds outright.
  anonymousAccess:
    enabled: true

  # The Job connects to openldap.fullnameOverride by default. Set this only
  # when the service name is intentionally different from the chart name.
  serviceName: ""

  # By default the Job uses the same image as the OpenLDAP dependency. The
  # image must contain /bin/sh, ldapsearch, and ldapmodify.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  memberofModulePath: /opt/bitnami/openldap/lib/openldap/memberof.so

  job:
    backoffLimit: 6
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 300
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
