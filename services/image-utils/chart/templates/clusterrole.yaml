{{- $patcher := index .Values "imagepullsecret-patcher" -}}
{{- if $patcher.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "image-utils.imagepullsecret-patcher.fullname" . }}
  labels:
    {{- include "image-utils.imagepullsecret-patcher.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - list
      - patch
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - list
      - get
{{- end -}}
