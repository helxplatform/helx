{{- $patcher := index .Values "imagepullsecret-patcher" -}}
{{- if $patcher.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "image-utils.imagepullsecret-patcher.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "image-utils.imagepullsecret-patcher.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "image-utils.imagepullsecret-patcher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
