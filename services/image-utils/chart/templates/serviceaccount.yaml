{{- $patcher := index .Values "imagepullsecret-patcher" -}}
{{- if and $patcher.enabled $patcher.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "image-utils.imagepullsecret-patcher.serviceAccountName" . }}
  labels:
    {{- include "image-utils.imagepullsecret-patcher.labels" . | nindent 4 }}
  {{- with $patcher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
