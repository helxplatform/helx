{{- if .Values.secret.migration.enabled -}}
  {{- fail "ldap-sync: automatic Secret migration is unsupported; select existingSecret, chart-managed values, or ExternalSecret ownership explicitly" -}}
{{- end -}}
{{- $mode := include "helx-common.secret.mode.v1" (dict
  "mode" .Values.secret.mode
  "existingSecret" .Values.secret.existingSecret
  "externalSecret" .Values.secret.externalSecret
  "secretValueBlockPath" "secret"
) -}}
{{- $secretValues := deepCopy (default (dict) .Values.secret.values) -}}
{{- if eq $mode "values" -}}
  {{- if not (hasKey $secretValues "SOURCE_BIND_PASSWORD") -}}
    {{- if .Values.config.source.bindPassword -}}
      {{- $_ := set $secretValues "SOURCE_BIND_PASSWORD" .Values.config.source.bindPassword -}}
    {{- end -}}
  {{- end -}}
  {{- if not (hasKey $secretValues "TARGET_BIND_PASSWORD") -}}
    {{- if .Values.config.target.bindPassword -}}
      {{- $_ := set $secretValues "TARGET_BIND_PASSWORD" .Values.config.target.bindPassword -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" (include "ldap-sync.managedSecretName" .)
  "mode" .Values.secret.mode
  "secretValueBlockPath" "secret"
  "existingSecret" .Values.secret.existingSecret
  "values" $secretValues
  "externalSecret" .Values.secret.externalSecret
  "externalSecretName" (include "ldap-sync.fullname" .)
  "requiredKeys" (list "SOURCE_BIND_PASSWORD" "TARGET_BIND_PASSWORD")
) -}}
