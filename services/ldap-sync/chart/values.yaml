# Default values for ldap-sync.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: containers.renci.org/helxplatform/ldap-sync
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: secrets-options-test-1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5500

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1
    memory: "1G"
  requests:
    cpu: 1
    memory: "1G"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

loglevel: "info"

# LDAP bind credential Secret contract. Select exactly one ownership mode:
# existingSecret, secret.values, or secret.externalSecret.enabled.
secret:
  # -- Name of a caller-managed Secret containing SOURCE_BIND_PASSWORD and
  # TARGET_BIND_PASSWORD. When set, the chart does not create or manage it.
  existingSecret: ""

  # -- Key/value pairs used to create the chart-managed LDAP credential Secret.
  # Required keys are SOURCE_BIND_PASSWORD and TARGET_BIND_PASSWORD.
  # Values are mounted as files and are never rendered into the ConfigMap.
  values: {}

  # -- Configure an ExternalSecret to populate the LDAP credential Secret.
  # This is mutually exclusive with secret.existingSecret.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to <fullname>-secrets.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- No differently named legacy Secret exists. Legacy bindPassword values
    # are copied into managed Secret data only when chart-managed mode is used.
    enabled: false

# Reconcile the initial search through the ldap-sync API after the Service is ready.
# Bind credentials should be supplied through secret.existingSecret,
# secret.values, or External Secrets rather than committed to this file.
searchBootstrap:
  enabled: true
  id: get-groups
  filter: '(&(objectClass=uncgroup)(cn=unc:app:renci:ai-sandbox:*))'
  refresh: 60
  baseDN: ou=groups,dc=unc,dc=edu
  oneShot: false
  image:
    repository: curlimages/curl
    tag: 8.10.1
    pullPolicy: IfNotPresent
  job:
    backoffLimit: 6
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    waitTimeoutSeconds: 300
    retryIntervalSeconds: 5
    rolloutImage:
      repository: registry.k8s.io/kubectl
      tag: v1.31.0
      pullPolicy: IfNotPresent
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsUser: 100
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

config:
  hooks:
    - args:
        - --baseGid=1025
        - --baseGroup=helx-users
      image:
        repository: containers.renci.org/helxplatform/unc-group-x
        tag: v2.3.2
      name: unc-group-x
      url: http://localhost:5001/hook
  hookRetry:
    maxRetries: 10
    initialDelayMs: 100
    maxDelayMs: 30000
  source:
    url: "ldap://ldap.unc.edu/"
    bindDN: "cn=unc:app:renci:helx:ns,ou=Applications,dc=unc,dc=edu"
    # -- Deprecated compatibility input. Use secret.values.SOURCE_BIND_PASSWORD.
    bindPassword: ""
    baseDN: "dc=unc,dc=edu"
  target:
    url: "ldap://openldap/"
    bindDN: "cn=admin,dc=example,dc=org"
    # -- Deprecated compatibility input. Use secret.values.TARGET_BIND_PASSWORD.
    bindPassword: ""
    baseDN: "dc=example,dc=org"
  plugins:
    # Creates a PVC in the release namespace for every synced group
    # entry. When enabled, the chart also installs a Role/RoleBinding
    # granting the service account get/list/create on PVCs.
    pvcGroup:
      enabled: true
      storageClass: azurefile
      size: 10Gi
      accessModes:
        - ReadWriteMany

# PostgreSQL configuration
postgres:
  enabled: true
  # The dependency's fullname becomes <release-name>-ldap-sync-postgres.
  nameOverride: ldap-sync-postgres

  migration:
    # -- Enable the one-time migration from the previous PostgreSQL names.
    # This is valid only during a Helm upgrade of an existing release.
    enabled: false
    # -- Name of the PostgreSQL Secret from the previous chart deployment.
    # This must be the old chart's computed Secret name. If unknown, it is
    # likely <release-name>-postgres; verify it with kubectl before upgrading.
    legacySecret: ""
    # -- Name of the existing PostgreSQL PVC from the previous deployment.
    # It is likely data-<release-name>-postgres-0, but verify it in the cluster.
    legacyPvc: ""

  persistence:
    enabled: true
    size: 8Gi
  auth:
    # Username for the database
    username: ldapsync
    # Database name
    database: ldapsync
    # Leave empty to let the PostgreSQL dependency create its fullname-based
    # Secret. Set this to a pre-created Secret to manage the password outside
    # the dependency chart. During migration, set this to the new fullname so
    # the migration hook can create the target Secret before the dependency
    # starts, and keep it set afterwards: the migrated Secret is a hook resource
    # the dependency does not own, so clearing this asks the dependency to
    # create a Secret that already exists.
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
  # SSL mode for PostgreSQL connection (disable, require, verify-ca, verify-full)
  sslmode: disable
  config:
    # postgres 14+ stores passwords as scram-sha-256 by default.
    # The cloudpirates chart's default pg_hba.conf uses md5 for remote connections,
    # which cannot verify a scram-sha-256 hash — remote auth fails even though the
    # readiness probe (127.0.0.1 = trust) passes. Override to scram-sha-256.
    pgHbaConfig: |
      local   all             all                                     trust
      host    all             all             127.0.0.1/32            trust
      host    all             all             ::1/128                 trust
      local   replication     all                                     trust
      host    replication     all             127.0.0.1/32            trust
      host    replication     all             ::1/128                 trust
      host    all             all             all                     scram-sha-256
  # Additional PostgreSQL configuration can be added here
  # For example, resource limits, custom configuration, etc.
