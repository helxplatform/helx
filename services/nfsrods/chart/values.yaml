# Default values for nfsrods.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: irods/nfsrods
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: 1.0.0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

secret:
  # -- Name of a caller-managed Secret containing IRODS_PROXY_ADMIN_USERNAME and
  # IRODS_PROXY_ADMIN_PASSWORD. When set, the chart does not create or manage a
  # Secret.
  existingSecret: ""

  # -- Key/value pairs used to create the chart-managed proxy-admin Secret when
  # secret.existingSecret is empty and secret.externalSecret is disabled.
  # Required keys:
  #   IRODS_PROXY_ADMIN_USERNAME: iRODS proxy administrator username
  #   IRODS_PROXY_ADMIN_PASSWORD: iRODS proxy administrator password
  # Argo CD users should provide stable encrypted values or select an external
  # ownership mode.
  values: {}

  # -- Configure an ExternalSecret to populate the proxy-admin Secret. This is
  # mutually exclusive with secret.existingSecret.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to <fullname>-secrets.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- No legacy Secret migration is performed. Existing installations must
    # select one of the three supported ownership modes explicitly.
    enabled: false

serverJsonInit:
  image:
    repository: python
    tag: "3.12-alpine"
    pullPolicy: IfNotPresent
  securityContext: {}

# -- Additional annotations for the nfsrods Pod. A Secret-reloader annotation
# can be supplied here when automatic restarts after ESO rotation are required.
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  nfsPort: 2049
  mountdPort: 20048
  rpcbindPort: 111
  # -- NOTE: This IP must be a valid, unused IP in the cluster's service CIDR.
  #    A hostname or servicename will not resolve b/c of the DNS settings on nodes.
  #  ip: 10.233.58.200 (previous default)
  ip:

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

runArgs: "/usr/sbin/useradd -m -u 1000 -s /bin/bash rods; ./start.sh"

sharedStorage:
  createPVC: true
  createPV: true
  # -- No data is actually stored here, just a pointer to the nfsrods service IP.
  storageSize: 100Gi
  # -- This storageClass doesn't need to exist in the cluster since the PVC is directly selecting the PV
  storageClass: nfsrods-sc
  nfs:
    path: /

server:
  nfs_server:
    port: 2049
    irods_mount_point: /ExampleZone
    user_information_refresh_time_in_milliseconds: 3600000
    file_information_refresh_time_in_milliseconds: 1000
    user_access_refresh_time_in_milliseconds: 1000
    object_type_refresh_time_in_milliseconds: 300000
    user_permissions_refresh_time_in_milliseconds: 300000
    user_type_refresh_time_in_milliseconds: 300000
    list_operation_query_results_refresh_time_in_milliseconds: 30000
    allow_overwrite_of_existing_files: true
    using_oracle_database: false
  irods_client:
    zone: ExampleZone
    host: example.com
    port: 1247
    default_resource: demoResc
    ssl_negotiation_policy: CS_NEG_REFUSE
    connection_timeout_in_seconds: 600

global:
  stdnfsPvc: stdnfs
