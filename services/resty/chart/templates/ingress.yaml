{{- if .Values.ingress.create }}
{{- /*
The TLS Secret has its own certificate lifecycle and stays caller-managed, so
this chart only ever names one. An SSL block with no Secret name still renders,
which is how a deployment asks the ingress controller for its default
certificate; only a missing block is an error, and that used to be a nil pointer.
*/}}
{{- $tlsSecret := "" -}}
{{- if .Values.ingress.tls.enabled -}}
  {{- if not (kindIs "map" .Values.SSL) -}}
    {{- fail "resty: ingress.tls.enabled requires an SSL block; set SSL.nginxTLSSecret to an existing TLS Secret, set SSL to {} to use the ingress controller's default certificate, or set ingress.tls.enabled=false" -}}
  {{- end -}}
  {{- $tlsSecret = default "" .Values.SSL.nginxTLSSecret -}}
{{- end -}}
{{- if .Values.basicAuth.enabled }}
  {{- $_ := set .Values.ingress.annotations "nginx.ingress.kubernetes.io/auth-type" "basic" }}
  {{- $_ := set .Values.ingress.annotations "nginx.ingress.kubernetes.io/auth-secret" (include "resty.basicAuthSecretName" .) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "resty.fullname" . }}
{{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
{{- if .Values.ingress.ingressClassName }}
  ingressClassName: "{{ .Values.ingress.ingressClassName }}"
{{- end}}
{{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
      - "{{ .Values.service.serverName }}"
{{- if $tlsSecret }}
    secretName: "{{ $tlsSecret }}"
{{- end }}
{{- end}}
  rules:
  - host: "{{ .Values.service.serverName }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "resty.fullname" . }}
            port:
              number: {{ .Values.service.httpPort }}
---
{{- if .Values.ingress.admin.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "resty.fullname" . }}-admin
  {{- with .Values.ingress.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.ingress.ingressClassName }}
  ingressClassName: "{{ .Values.ingress.ingressClassName }}"
{{- end}}
{{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
      - "{{ .Values.service.serverName }}"
{{- if $tlsSecret }}
    secretName: "{{ $tlsSecret }}"
{{- end }}
{{- end}}
  rules:
  - host: "{{ .Values.service.serverName }}"
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: {{ include "resty.fullname" . }}
            port:
              number: {{ .Values.service.httpPort }}
{{- end }}
{{- end }}
