apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resty.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "resty.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
        checksum/default-nginx-conf: {{ include (print $.Template.BasePath "/nginx-default-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "resty.labels" . | nindent 8 }}
    spec:
      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: ambassador-nginx-conf
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        ports:
        - containerPort: {{ .Values.service.httpTargetPort }}
        {{- if .Values.SSL }}
        - containerPort: {{ .Values.service.httpsTargetPort }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: default-nginx-conf
          mountPath: /opt/bitnami/openresty/nginx/conf/conf.d
        - name: nginx-conf
          mountPath: "/opt/bitnami/openresty/nginx/conf/nginx.conf"
          subPath: nginx.conf
        {{- if .Values.SSL }}
        - name: secret-volume
          mountPath: /opt/bitnami/openresty/nginx/conf/certs
        {{- end }}
        # nginx.conf (see nginx-configmap.yaml) points its pid file, proxy/
        # fastcgi/etc. temp dirs, and access/error logs here -- the only paths
        # this process writes to.
        - name: var-mounts
          mountPath: /opt/bitnami/openresty/nginx/tmp
          subPath: tmp
        - name: var-mounts
          mountPath: /opt/bitnami/openresty/nginx/logs
          subPath: logs
        # Uncomment command/args for debugging when things go wrong.
        # command: ['/bin/bash', '-c']
        # args: ["while true; do date; sleep 5; done"]
      # Load the configuration files for nginx
      volumes:
        - name: default-nginx-conf
          configMap:
            name: {{ .Release.Name }}-default-nginx-conf
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-nginx-conf
        {{- if .Values.SSL }}
        - name: secret-volume
          secret:
            secretName: {{ .Values.SSL.nginxTLSSecret }}
        {{- end }}
        {{- if .Values.varStorage.claimName }}
        - name: var-mounts
          persistentVolumeClaim:
            claimName: {{ .Values.varStorage.claimName }}
        {{- else }}
        - name: var-mounts
          emptyDir: {}
        {{- end }}
