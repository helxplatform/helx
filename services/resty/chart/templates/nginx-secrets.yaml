{{- if .Values.basicAuth.enabled }}
{{- include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" (include "resty.basicAuthManagedSecretName" .)
  "mode" .Values.secret.mode
  "secretValueBlockPath" "secret"
  "existingSecret" .Values.secret.existingSecret
  "values" (fromYaml (include "resty.basicAuthSecretValues" .))
  "preserveKeys" (list)
  "externalSecret" .Values.secret.externalSecret
  "externalSecretName" (include "resty.fullname" .)
  "requiredKeys" (list "auth")
) -}}
{{- end }}
