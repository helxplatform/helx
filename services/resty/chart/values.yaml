# Default values for resty.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: bitnami/openresty
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: 1.21
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  # -- can be LoadBalancer or ClusterIP. If ingress.create=true, this setting is ignored and defaulted to ClusterIP
  type: LoadBalancer
  # -- The static IP for this service, assigned to you by cluster administrators. Ignored if ingress.create=true.
  IP:
  httpPort: 80
  httpTargetPort: 8080
  httpsPort: 443
  httpsTargetPort: 8443
  serverName: _
  # nodePort: 31337

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi


DEV_PHASE:
  # -- Set the DEV_PHASE.dev True, if Appstore/Tycho running locally. Else, set it to False
  dev: False

# The TLS Secret has a separate certificate lifecycle and remains caller-managed;
# this chart does not create it. Uncomment the SSL block after creating the Secret.
# Note: an SSL block whose Secret name is empty renders an Ingress without a
# secretName, which asks the ingress controller for its default certificate.
# kubectl create secret tls resty-tls-secret --key resty.key --cert resty.crt
# SSL:
#   nginxTLSSecret: resty-tls-secret

ingress:
  # -- Create an Ingress resource or not. New installations of helx should set this to true to avoid needing to request a static IP.
  create: false
  # -- Set to use a specific ingress class other than the default.
  ingressClassName:
  annotations: {}
    # kubernetes.io/ingress.class: : ""
  tls:
    # -- Values inserted into the TLS block come from SSL.nginxTLSSecret and service.serverName for backward compatibility.
    # SSL.nginxTLSSecret is required when this is enabled together with ingress.create; the chart fails to render otherwise.
    enabled: true
  admin:
    # -- Create an additional Ingress to restrict access to /admin routes
    enabled: false
    annotations: {}
      # nginx.ingress.kubernetes.io/whitelist-source-range: "172.25.0.0/16,152.54.0.0/22,152.54.8.0/23,152.54.6.0/24,152.54.4.0/23,152.54.15.132/32"


varStorage:
  existingClaim: false
  claimName:
  storageSize: 2Gi
  storageClass:

basicAuth:
  # -- Enables basic authentication for the site using the Secret selected below.
  enabled: false
  # -- Username the htpasswd entry is derived from. Only used in chart-managed
  # mode, and only when `secret.values.auth` is unset. There is no default, so a
  # deployment that enabled basic auth without choosing credentials now fails to
  # render instead of shipping a publicly known one.
  username: ""
  # -- Password the htpasswd entry is derived from. Must be set together with
  # `basicAuth.username`. bcrypt salts are random, so the derived entry is
  # rewritten on every render; set `secret.values.auth` to pin it.
  password: ""

secret:
  # -- Which owner writes this Secret: `values` for the chart-managed Secret
  # built from `secret.values`, `existingSecret` for one you create yourself, or
  # `externalSecret` for External Secrets. Declared rather than inferred, so
  # selecting a mode also means clearing the fields belonging to the others.
  mode: values

  # -- Name of a caller-managed Secret containing a precomputed htpasswd entry
  # under the key `auth`. When set, the chart does not manage the Secret.
  existingSecret: ""

  # -- Key/value pairs used for the chart-managed basic-auth Secret. Provide a
  # precomputed htpasswd entry under the required key `auth`. Takes precedence
  # over persisted cluster data, and is mutually exclusive with
  # `basicAuth.username`/`basicAuth.password`.
  values: {}

  # -- Configure an ExternalSecret to populate a Secret containing the
  # precomputed htpasswd key `auth`. Mutually exclusive with existingSecret.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to <release>-nginx-htpasswd.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- No differently named legacy Secret exists; the managed name is preserved.
    enabled: false


restartrApi: false

# -- If using an external http proxy host set this to true and specify serverName.  Used for TACC.
external_http_host: false

airflow:
  authenticate: true

workerConnections: 1024
stubStatus:
  enabled: false
  localhostOnly: true
  stubStatusLocation: "/nginx_status"

# -- PROTOTYPE (ambassador removal): cluster DNS used to re-resolve the
# dynamic /private/ upstreams at request time. Must point at your cluster
# DNS (CoreDNS/kube-dns). Some nginx builds require an IP here rather than
# a name -- set the CoreDNS service ClusterIP if the hostname form fails.
dnsResolver: kube-dns.kube-system.svc.cluster.local

global:
  ambassador_service_name: ambassador
  dug_web_service_name: dug-web
  dug_search_client_service_name: dug-search-client
  restartr_api_service_name: restartr-api-service
  # -- PROTOTYPE (ambassador removal): direct backend service names that
  # were previously reached only through the "ambassador" service.
  # appstore_service_name / ui_service_name: leave null to auto-derive — the
  # bare chart name ("appstore"/"ui") when resty is deployed on its own, or
  # "<release>-appstore"/"<release>-ui" when deployed as a subchart of the
  # umbrella. Set explicitly only if your Service names differ.
  appstore_service_name:
  ui_service_name:
  appstore_sockets_service_name: appstore-sockets-service
  airflow_service_name: airflow-webserver
  # -- Namespace where Tycho launches app pods (for /private DNS names).
  # Defaults to the release namespace when empty.
  apps_namespace: ""
  cluster_dns_suffix: svc.cluster.local

# -- Optional /artifact route to an in-cluster artifact-cache service (replaces
# the ambassador Mapping for /artifact). Enable in envs that serve the helx-apps
# registry/specs from an artifact cache (e.g. air-gapped OpenShift). Off by
# default. Set authenticate=true to require the auth_request gate on /artifact.
artifactCache:
  enabled: false
  serviceName: artifact-cache
  port: 8080
  authenticate: false
