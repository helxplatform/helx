apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ui.fullname" . }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ui.selectorLabels" . | nindent  6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # UNCDSR-182: env.json doesn't pre-exist in the image, and nothing
        # writes into the static-frontend-env emptyDir before the main
        # container's subPath mount is prepared. Confirmed live (2026-11-06):
        # kubelet defaults to creating a DIRECTORY at the subPath source in
        # that situation, not a file -- same root cause already fixed for
        # Tycho-launched apps' /etc/passwd via a seed init container (see
        # tycho/model.py's emptyDirSeeded:// scheme), just not caught here at
        # the time since only the main page load, not this endpoint, was
        # tested. This mounts the same volume whole (no subPath) and touches
        # an empty file at the exact subPath location first; start_server's
        # populate_env then writes the real content into a file that already
        # exists, instead of into kubelet's auto-created directory.
        - name: seed-env-json
          image: busybox
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'mkdir -p /seed && touch /seed/env.json']
          volumeMounts:
            - name: static-frontend-env
              mountPath: /seed
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: 100
            httpGet:
              path: /
              port: 8080
          readinessProbe:
            initialDelaySeconds: 100
            httpGet:
              path: /
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: branddesc
              mountPath: /usr/share/nginx/static/frontend/brand_desc.html
              subPath: brand_desc.html
            # UNCDSR-182: nginx.conf already redirects its own temp/pid paths
            # under /tmp ("added to run as non-root"); access/error logs are
            # the stock nginx image's symlinks to stdout/stderr, not regular
            # files. This one emptyDir covers all of that.
            - name: tmp
              mountPath: /tmp
            # start_server (populate_env) generates this fresh; it isn't part
            # of the build output under /usr/share/nginx/static/frontend/.
            - name: static-frontend-env
              mountPath: /usr/share/nginx/static/frontend/env.json
              subPath: env.json
            # create_index writes the generated index.html directly here now
            # (see start_server). This mounts the whole directory, not just
            # index.html via subPath: Kubernetes subPath cannot cleanly
            # replace a file that already exists in the image (confirmed by
            # direct testing against this image -- subPath onto index.html
            # fails every time with "not a directory", while the identical
            # mount onto a path absent from the image works). start_server
            # re-seeds the rest of the directory (notably the stock 50x.html
            # error page) from a pristine backup baked at
            # /usr/share/nginx/html.default before writing index.html.
            - name: nginx-html-index
              mountPath: /usr/share/nginx/html
          env: 
            - name: NODE_ENV
              value: production
            - name: REACT_APP_ANALYTICS_ENABLED
              valueFrom:
                configMapKeyRef:
                  key: analytics_enabled
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_ANALYTICS_PLATFORM
              valueFrom:
                configMapKeyRef:
                  key: analytics_platform
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_ANALYTICS_TOKEN
              valueFrom:
                configMapKeyRef:
                  key: analytics_token
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_HELX_SEARCH_URL
              valueFrom:
                configMapKeyRef:
                  key: search_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_APPSTORE_ASSET_BASE_URL
              valueFrom:
                configMapKeyRef:
                  key: appstore_asset_base_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_APPSTORE_ASSET_BRANCH
              valueFrom:
                configMapKeyRef:
                  key: appstore_asset_branch
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_HIDDEN_RESULT_TABS
              valueFrom:
                configMapKeyRef:
                  key: hidden_result_tabs
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SEMANTIC_SEARCH_ENABLED
              valueFrom:
                configMapKeyRef:
                  key: search_enabled
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_TRANQL_URL
              valueFrom:
                configMapKeyRef:
                  key: tranql_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_UI_BRAND_NAME
              valueFrom:
                configMapKeyRef:
                  key: brand_name
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_WORKSPACES_ENABLED
              valueFrom:
                configMapKeyRef:
                  key: workspaces_enabled
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_DEFAULT_SPACE
              valueFrom:
                configMapKeyRef:
                  key: default_space
                  name: {{ include "ui.fullname" . }}-config
            - name: META_TITLE
              valueFrom:
                configMapKeyRef:
                  key: meta_title
                  name: {{ include "ui.fullname" . }}-config
            - name: META_DESCRIPTION
              valueFrom:
                configMapKeyRef:
                  key: meta_description
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_LOGIN_TITLE
              valueFrom:
                configMapKeyRef:
                  key: login_title
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SUPPORT_HELP_PORTAL_URL
              valueFrom:
                configMapKeyRef:
                  key: support_help_portal_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SUPPORT_USER_GUIDE_URL
              valueFrom:
                configMapKeyRef:
                  key: support_user_guide_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SUPPORT_FAQS_URL
              valueFrom:
                configMapKeyRef:
                  key: support_faqs_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SUPPORT_INTRO_VIDEO_URL
              valueFrom:
                configMapKeyRef:
                  key: support_intro_video_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SUPPORT_HOWTO_VIDEO_URL
              valueFrom:
                configMapKeyRef:
                  key: support_howto_video_url
                  name: {{ include "ui.fullname" . }}-config
            - name: REACT_APP_SEARCH_TOUR_ENABLED
              valueFrom:
                configMapKeyRef:
                  key: search_tour_enabled
                  name: {{ include "ui.fullname" . }}-config
      volumes:
        - name: branddesc
          configMap:
            name: {{ include "ui.fullname" . }}-config
            items:
              - key: brand_desc.html
                path: brand_desc.html
        - name: tmp
          emptyDir: {}
        - name: static-frontend-env
          emptyDir: {}
        - name: nginx-html-index
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
