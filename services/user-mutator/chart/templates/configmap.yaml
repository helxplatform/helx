{{- if .Values.config.enabled }}
{{- $secretNames := include "user-mutator.effectiveSecretNames" . | fromYaml }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-mutator.fullname" . }}-config
  labels:
    app: {{ include "user-mutator.name" . }}
    chart: {{ include "user-mutator.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
  config.json: |
    {
      "meta": {
        {{- if .Values.config.features.ldap }}
        "nslcd_config_map_name": "{{ include "user-mutator.fullname" . }}-nslcd-config",
        "nslcd_sidecar_image": "{{ .Values.ldap.sidecar.image }}"
        {{- end }}
      },
      "features": {{ toPrettyJson .Values.config.features | nindent 8 }},
      "secrets": {{ toPrettyJson $secretNames | nindent 8 }}
    }
{{- if .Values.config.features.ldap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-mutator.fullname" . }}-nslcd-config
  labels:
    app: {{ include "user-mutator.name" . }}
    chart: {{ include "user-mutator.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
  # nslcd.conf is consumed by the injected nslcd sidecar (nss-pam-ldapd),
  # the maintained successor to the EOL libnss-ldap. The app container talks
  # to this daemon over the shared /var/run/nslcd/socket via libnss-ldapd.
  # Bind is anonymous (as the retired libnss-ldap.conf was); POSIX attributes
  # are read without credentials, so no LDAP secret is injected into app pods.
  nslcd.conf: |
    {{- $ldap := .Values.config.features.ldap }}
    {{- $tls := $ldap.tls | default dict }}
    {{- $mode := $tls.mode | default "off" }}
    uri {{ if eq $mode "ldaps" }}ldaps{{ else }}ldap{{ end }}://{{ $ldap.host }}{{ if $ldap.port }}:{{ $ldap.port }}{{ end }}
    ldap_version 3
    base {{ $ldap.user_base_dn }}
    base group {{ $ldap.group_base_dn }}
    {{- if eq $mode "starttls" }}
    ssl start_tls
    {{- else if eq $mode "ldaps" }}
    ssl on
    {{- else }}
    ssl off
    {{- end }}
    {{- if ne $mode "off" }}
    tls_reqcert {{ $tls.reqcert | default "demand" }}
    {{- if $tls.caCertFile }}
    tls_cacertfile {{ $tls.caCertFile }}
    {{- end }}
    {{- end }}
  nsswitch.conf: |
    passwd:         files ldap
    group:          files ldap
{{- end }}
{{- end }}
