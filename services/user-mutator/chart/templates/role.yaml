{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user-mutator-role
  namespace: {{ .Release.Namespace }}
rules:
# FindMatchingResources lists and regex-matches by name. RBAC does not honor
# resourceNames on the list verb, so these cannot be scoped further.
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "configmaps"]
  verbs: ["list"]
{{- if .Values.rbac.secretDiscovery }}
# list on secrets grants read access to the contents of every secret in the
# namespace. Only secret:// volume sources containing a capture group need it.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]
{{- end }}
{{- end }}
