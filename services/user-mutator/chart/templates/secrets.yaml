{{- if ne .Values.secret.mode "generate" }}
{{/* generate mode renders this Secret from webhook.yaml, alongside the
MutatingWebhookConfiguration that has to carry the matching CA bundle. */}}
{{ include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" (include "user-mutator.tlsManagedSecretName" .)
  "mode" .Values.secret.mode
  "secretValueBlockPath" "secret"
  "existingSecret" .Values.secret.existingSecret
  "values" .Values.secret.values
  "externalSecret" .Values.secret.externalSecret
  "externalSecretName" (include "user-mutator.tlsManagedSecretName" .)
  "requiredKeys" (list "tls.crt" "tls.key")
  "type" "kubernetes.io/tls"
) }}
{{- end }}
{{ if .Values.config.features.ldap }}
---
{{ include "helx-common.secret.resources.v1" (dict
  "root" .
  "defaultName" (include "user-mutator.ldapManagedSecretName" .)
  "mode" .Values.ldap.secret.mode
  "secretValueBlockPath" "ldap.secret"
  "existingSecret" .Values.ldap.secret.existingSecret
  "values" .Values.ldap.secret.values
  "externalSecret" .Values.ldap.secret.externalSecret
  "externalSecretName" (include "user-mutator.ldapManagedSecretName" .)
  "requiredKeys" (list "password")
) }}
{{ end }}
