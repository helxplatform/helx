{{- include "user-mutator.validateTlsMode" . -}}
{{- $caBundle := "" -}}
{{- $certs := dict -}}
{{- if .Values.secret.generate.enabled -}}
  {{- $certs = include "user-mutator.webhookCertData" . | fromYaml -}}
  {{- $caBundle = get $certs "ca.crt" -}}
{{- else -}}
  {{/*
  webhook.caBundle is the single source outside generate mode. The chart does
  not read the CA out of secret.values: that block is inert in existingSecret
  and externalSecret modes, so consulting it would let a stale entry supply a
  bundle unrelated to the mounted certificate. In generate mode the chart owns
  the CA and never looks here at all.
  */}}
  {{- $caBundle = default "" .Values.webhook.caBundle -}}
  {{- include "user-mutator.validateCaBundle" $caBundle -}}
{{- end -}}
{{- if .Values.secret.generate.enabled }}
{{/*
The chart-generated Secret and the MutatingWebhookConfiguration are rendered
from this one file on purpose. Helm templates are pure functions with no
memoisation, so resolving the certificate in two separate files would generate
two unrelated key pairs on a fresh install and the caBundle would not match the
serving certificate.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "user-mutator.tlsManagedSecretName" . }}
  labels:
    {{- include "user-mutator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ get $certs "tls.crt" }}
  tls.key: {{ get $certs "tls.key" }}
  ca.crt: {{ get $certs "ca.crt" }}
{{- end }}
{{- if .Values.webhook.enabled }}
{{- if not $caBundle }}
  {{- fail (include "user-mutator.missingCaBundleMessage" .) -}}
{{- end }}
{{- $namespaces := .Values.webhook.namespaces }}
{{- if not $namespaces }}
  {{- $namespaces = list .Release.Namespace }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "user-mutator.webhookName" . }}
  labels:
    {{- include "user-mutator.labels" . | nindent 4 }}
webhooks:
  - name: {{ printf "%s.%s.svc" (include "user-mutator.fullname" .) .Release.Namespace }}
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    reinvocationPolicy: {{ .Values.webhook.reinvocationPolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        name: {{ include "user-mutator.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: {{ .Values.webhook.path }}
        port: {{ .Values.service.port }}
    rules:
      {{- toYaml .Values.webhook.rules | nindent 6 }}
    namespaceSelector:
      {{- with .Values.webhook.matchLabels }}
      matchLabels:
        {{- range $labelKey, $labelValue := . }}
        {{ $labelKey }}: {{ $labelValue | toString | quote }}
        {{- end }}
      {{- end }}
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml $namespaces | nindent 12 }}
        {{- with .Values.webhook.extraMatchExpressions }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
