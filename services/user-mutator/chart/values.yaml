# Default values for user-mutator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: containers.renci.org/helxplatform/user-mutator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


# Webhook TLS Secret contract. The caller-managed historical Secret remains the
# default for backward compatibility. Set existingSecret to "" to select either
# chart-managed values or External Secrets Operator mode.
secret:
  # -- Name of a caller-managed TLS Secret. Mutually exclusive with
  # secret.externalSecret.enabled.
  existingSecret: user-mutator-cert-tls

  # -- Plaintext values for the chart-managed TLS Secret. tls.crt and tls.key
  # are required in managed mode; ca.crt is optional.
  values: {}

  # -- Configure an ExternalSecret to populate the webhook TLS Secret.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to <fullname>-tls.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  migration:
    # -- Automatic migration is not supported because the historical TLS Secret
    # is created and owned outside Helm.
    enabled: false

ldap:
  secret:
    # -- Name of a caller-managed Secret containing the password key. This
    # contract is only rendered and mounted when config.features.ldap is enabled.
    existingSecret: user-mutator-ldap-password

    # -- Plaintext values for the chart-managed LDAP Secret. `password` is
    # required in managed mode.
    values: {}

    # -- Configure an ExternalSecret to populate the LDAP password Secret.
    externalSecret:
      enabled: false
      # -- Optional ESO target Secret name. Defaults to
      # <fullname>-ldap-password.
      targetName: ""
      refreshInterval: 1h
      secretStoreRef:
        name: vault
        kind: SecretStore
      remoteRef: ""

    migration:
      # -- Automatic migration is not supported because the historical LDAP
      # Secret is created and owned outside Helm.
      enabled: false

# Configure optional features. To enable LDAP, provide its connection settings;
# doing so also activates the ldap.secret contract above.
#
# features:
#   ldap:
#     host: "ldap.example.org"
#     port: 389
#     username: "cn=admin,dc=example,dc=org"
#     user_base_dn: "ou=users,dc=example,dc=org"
#     group_base_dn: "ou=groups,dc=example,dc=org"
config:
  enabled: true
  maps:
    user-profiles: user-profiles
  features: {}
  # -- Unknown, caller-managed Secret contracts to expose to the application.
  # Keys become config.json secret aliases and mount directory names; values are
  # Secret resource names. The reserved keys cert and ldap-password cannot be
  # overridden here.
  additionalSecrets: {}

  # config.secrets is deprecated and intentionally has no entry here. Its
  # absence is what lets the chart tell a caller-supplied map apart from a
  # chart default, so do not add it back. When supplied, its cert and
  # ldap-password entries are honoured only if the matching contract above is
  # untouched; every other entry behaves as config.additionalSecrets. Migrate
  # to secret.existingSecret, ldap.secret.existingSecret, and
  # config.additionalSecrets.
