# Default values for user-mutator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: containers.renci.org/helxplatform/user-mutator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


# Webhook TLS Secret contract. The chart generates the serving certificate by
# default; set generate.enabled to false and pick another mode to opt out.
secret:
  # -- Name of a caller-managed TLS Secret. Point this at a Secret preserved
  # from an earlier deployment to keep using it; the historical name was
  # user-mutator-cert-tls. Mutually exclusive with secret.generate.enabled and
  # secret.externalSecret.enabled, so selecting this mode means also setting
  # secret.generate.enabled to false.
  existingSecret: ""

  # -- Plaintext values for the chart-managed TLS Secret. tls.crt and tls.key
  # are required in managed mode; ca.crt is optional.
  values: {}

  # -- Configure an ExternalSecret to populate the webhook TLS Secret.
  externalSecret:
    enabled: false
    # -- Optional ESO target Secret name. Defaults to <fullname>-tls.
    targetName: ""
    refreshInterval: 1h
    secretStoreRef:
      name: vault
      kind: SecretStore
    remoteRef: ""

  # -- Fourth ownership mode: the chart generates a self-signed CA and serving
  # certificate for the webhook. Mutually exclusive with existingSecret,
  # values, and externalSecret. Requires secret.existingSecret: "". Generated
  # material is persisted, so upgrades never rotate it out from under a
  # MutatingWebhookConfiguration; rotate by deleting the Secret named
  # <fullname>-tls and upgrading again.
  generate:
    enabled: true
    # -- Certificate lifetime. There is no automatic rotation, so this is long
    # by default.
    validityDays: 3650

ldap:
  secret:
    # -- Name of a caller-managed Secret containing the password key. Only
    # rendered and mounted when config.features.ldap is enabled. Point this at
    # a Secret preserved from an earlier deployment to keep using it; the
    # historical name was user-mutator-ldap-password.
    existingSecret: ""

    # -- Plaintext values for the chart-managed LDAP Secret. `password` is
    # required in managed mode.
    values: {}

    # -- Configure an ExternalSecret to populate the LDAP password Secret.
    externalSecret:
      enabled: false
      # -- Optional ESO target Secret name. Defaults to
      # <fullname>-ldap-password.
      targetName: ""
      refreshInterval: 1h
      secretStoreRef:
        name: vault
        kind: SecretStore
      remoteRef: ""

# Cluster-scoped MutatingWebhookConfiguration, rendered by default so that
# installing the chart produces a working webhook with no out-of-band steps.
#
# Namespaces are selected by their automatic kubernetes.io/metadata.name label,
# so no namespace has to be labelled for mutation to take effect.
#
# To manage this object yourself, set enabled to false.
webhook:
  # -- Render the MutatingWebhookConfiguration. Requires a CA bundle, from
  # either secret.generate.enabled or webhook.caBundle.
  enabled: true

  # -- Name of the configuration. Defaults to <fullname>-webhook-<namespace>.
  # The release qualifier keeps two releases in one namespace apart, and the
  # namespace qualifier keeps one release name in two namespaces apart, which
  # matters because the object is cluster-scoped. Override it only when you
  # need a specific name; a configuration created out of band should be
  # deleted rather than reused.
  name: ""

  # -- Namespaces whose Deployments are mutated. Defaults to the release
  # namespace.
  namespaces: []

  # -- Base64 CA bundle that signed the serving certificate. Only used when
  # secret.generate.enabled is false.
  caBundle: ""

  # -- Optional additional namespaceSelector matchLabels. Set this to
  # {enable-<webhook.name>: "true"} to keep the historical opt-in label as a
  # per-namespace toggle.
  matchLabels: {}

  # -- Additional namespaceSelector matchExpressions, ANDed with the
  # kubernetes.io/metadata.name clause. The defaults keep the webhook away from
  # control-plane and AKS-managed namespaces.
  extraMatchExpressions:
    - key: control-plane
      operator: NotIn
      values:
        - "true"

  failurePolicy: Ignore
  reinvocationPolicy: Never
  timeoutSeconds: 10
  path: /mutate

  # -- Resources the webhook is called for.
  rules:
    - apiGroups:
        - apps
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - deployments

# Configure optional features. To enable LDAP, provide its connection settings;
# doing so also activates the ldap.secret contract above.
#
# features:
#   ldap:
#     host: "ldap.example.org"
#     port: 389
#     username: "cn=admin,dc=example,dc=org"
#     user_base_dn: "ou=users,dc=example,dc=org"
#     group_base_dn: "ou=groups,dc=example,dc=org"
config:
  enabled: true
  maps:
    user-profiles: user-profiles
  features: {}
  # -- Unknown, caller-managed Secret contracts to expose to the application.
  # Keys become config.json secret aliases and mount directory names; values are
  # Secret resource names. The reserved keys cert and ldap-password cannot be
  # overridden here.
  additionalSecrets: {}

  # config.secrets was removed in 2.0.0 and intentionally has no entry here.
  # Its absence lets the chart detect a caller-supplied map and fail, rather
  # than ignoring a custom Secret name. Do not add it back. Move its cert entry
  # to secret.existingSecret, its ldap-password entry to
  # ldap.secret.existingSecret, and anything else to config.additionalSecrets.
